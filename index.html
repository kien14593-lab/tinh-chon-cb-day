<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tính chọn Aptomat & Dây dẫn – Nhà dân dụng</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#dde3ea;--ink:#1f2933;--mute:#66788a;--acc:#1f5fa8;--acc2:#e8f0fb;--ok:#1e7d32;--warn:#b26a00;--err:#c62828;--inp:#fffdf2;--lt:#f2b705;--sk:#2e7d32;--dr:#c2410c}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
header{background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;flex:1;min-width:240px}
header h1 small{display:block;font-weight:normal;opacity:.8;font-size:11px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 10px;border-radius:5px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{padding:2px 7px;font-size:12px}
button.del{color:var(--err);border-color:transparent;background:transparent}
button.del:hover{border-color:var(--err)}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
nav{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:9;overflow-x:auto}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;background:none;white-space:nowrap}
nav button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:bold}
main{padding:14px 16px;max-width:1600px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card>.hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafbfd;border-radius:8px 8px 0 0}
.card>.hd h3{margin:0;font-size:14px}
.card>.bd{padding:10px 12px}
.ckt{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;margin:10px 0;background:#fff}
.ckt.light{border-left-color:var(--lt)}.ckt.socket{border-left-color:var(--sk)}.ckt.direct{border-left-color:var(--dr)}
.ckt>.ch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;background:#fbfcfe;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.ckt>.cb{padding:6px 10px}
.tag{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.tag.light{background:var(--lt);color:#3a2c00}.tag.socket{background:var(--sk)}.tag.direct{background:var(--dr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.i{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
input,select{font:inherit;padding:4px 6px;border:1px solid #c9d2dc;border-radius:4px;background:var(--inp);color:var(--ink);min-width:0}
input[type=number]{width:72px}
input.w{width:100%}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
th{background:#f0f3f7;font-weight:bold;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:bold}
.p-ok{background:#e6f4ea;color:var(--ok)}.p-w{background:#fff3e0;color:var(--warn)}.p-e{background:#fdecea;color:var(--err)}
.msg{font-size:11.5px;line-height:1.35}
.msg .e{color:var(--err)}.msg .w{color:var(--warn)}.msg .i{color:var(--mute)}
.res{font-weight:bold;color:var(--acc)}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px}
.sum b{color:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kpi div{background:var(--acc2);border-radius:6px;padding:8px 10px}
.kpi small{display:block;color:var(--mute);font-size:11px}
.kpi b{font-size:15px}
.hint{color:var(--mute);font-size:12px;margin:4px 0 0}
.sld{display:flex;flex-direction:column;align-items:center}
.box{border:2px solid var(--acc);border-radius:8px;background:#fff;padding:8px 12px;text-align:center;min-width:240px}
.box h4{margin:0 0 4px;font-size:13px}
.vline{width:2px;height:22px;background:var(--acc)}
.bus{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;border-top:2px solid var(--acc);width:100%}
.br{display:flex;flex-direction:column;align-items:center;min-width:220px;max-width:290px}
.br .box{border-color:#5b8bc6;min-width:210px}
.br ul{list-style:none;margin:6px 0 0;padding:0;width:100%}
.br li{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:4px 6px;margin-bottom:4px;background:#fff;font-size:11.5px}
.br li.light{border-left-color:var(--lt)}.br li.socket{border-left-color:var(--sk)}.br li.direct{border-left-color:var(--dr)}
.legend{font-size:11.5px;color:var(--mute);margin-top:10px;text-align:center}
.ph{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:bold;text-align:center}
.phA{background:#c62828}.phB{background:#f9a825}.phC{background:#1565c0}
.doc h3{margin:16px 0 6px}.doc p,.doc li{line-height:1.5}
details summary{cursor:pointer;color:var(--acc);font-size:12px}
.toast{position:fixed;bottom:18px;right:18px;background:#263238;color:#fff;padding:9px 14px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:.95}
@media print{
 header,nav,.noprint,button{display:none!important}
 body{background:#fff;font-size:11px}
 main{padding:0;max-width:none}
 .card,.ckt{break-inside:avoid;border-color:#999}
 input,select{border:none;background:none;padding:0;appearance:none}
 details{display:block}details>*{display:block}
}
</style>
</head>

<header>

 <button data-act="new">Dự án mới</button>

 <button data-tab="lib">6. Thư viện thiết bị</button>

</main>

const ST=()=>S.settings;
const kt=()=>(KTEMP[ST().temp]||1)*(+ST().kgrp||1);
const selCB=I=>RATINGS.find(r=>r>=I-1e-9)||null;
const nextCB=r=>RATINGS.find(x=>x>r)||null;
const peOf=s=>s<=16?s:(s<=35?16:SECTIONS.find(x=>x>=s/2));
function dU(L,I,s,cos,U,three){const sin=Math.sqrt(Math.max(0,1-cos*cos));return (three?Math.sqrt(3):2)*L*I*(RHO/s*cos+XL*sin)/U*100;}
function selCable(In,Ib,L,cos,U,three,tbl,dUmax,minS,kz){
 let up=false;
 for(const s of SECTIONS){
  if(s<minS)continue;
  const iz=tbl[s]*kt()*(kz||1);
  if(iz<In)continue;
  const du=dU(L,Ib,s,cos,U,three);
  if(du>dUmax){up=true;continue;}
  return {S:s,iz,du,upDU:up};
 }
 return null;
}

function pickConduit(s,n){
 const od=WIRE_OD[s]||Math.sqrt(s)*2.2,aw=n*Math.PI*od*od/4,f=(+ST().fill||40)/100;
 for(let i=CONDUIT_MIN_BY_S(s);i<CONDUITS.length;i++){const di=CONDUITS[i][1];if(aw<=f*Math.PI*di*di/4)return {size:CONDUITS[i][0],fillPct:aw/(Math.PI*di*di/4)*100};}
 const l=CONDUITS.at(-1);return {size:l[0],fillPct:aw/(Math.PI*l[1]*l[1]/4)*100,over:true};
}

/* ---------- Hình học tuyến dây của 1 mạch ---------- */
// trả về các đoạn ống: {name,L (m thô),n:[L,N,PE],ends (số đầu chừa tại đế/hộp),panel (số đầu tại tủ),elb}
function routeOf(c,lib){
 const st=ST(),Ht=hRoute(c.route),vTu=Math.abs(Ht-+st.Htu),v=k=>Math.abs(Ht-hMount(k));
 const segs=[],acc={plates:{},lamps:[],sockets:[],jb:0,dbox:0,powSw:0,lampPts:0};let far=0;
 const pe=(c.type==='light'&&!+st.lightPE)?0:1;
 const add=(name,L,n,ends,panel)=>segs.push({name,L:Math.max(0,L),n,ends,panel:panel||0});
 const items=c.items.filter(it=>lib[it.devId]);
 if(!items.length)return {segs,acc,far:0};
 if(c.type==='light'){
  // gom theo bảng công tắc
  const plates={};items.forEach(it=>{const k=(it.plate||'CT?').trim()||'CT?';(plates[k]=plates[k]||[]).push(it);});
  const keys=Object.keys(plates);
  const pl=keys.map(k=>{const its=plates[k],swm=its[0].swm||'sw';return {k,its,swm,d:Math.max(...its.map(i=>+i.dSw||0)),vs:v(swm)};});
  if(c.topo==='radial'||pl.length===1){pl.forEach(p=>add('Tủ → bảng công tắc '+p.k,vTu+p.d+p.vs,[1,1,pe],1,1));}
  else{const dmax=Math.max(...pl.map(p=>p.d));add('Trục tủ → hộp nối các bảng công tắc',vTu+dmax,[1,1,pe],2*pl.length-1,1);
   pl.forEach(p=>add('Hộp nối → bảng công tắc '+p.k,+st.brOff+p.vs,[1,1,pe],2));acc.jb+=pl.length;}
  pl.forEach(p=>{
   acc.plates[p.k]={n:p.its.length,swm:p.swm,types:p.its.map(i=>i.swType||'c1'),fan:p.its.map(i=>/quạt/i.test(lib[i.devId].name))};
   p.its.forEach(it=>{const d=lib[it.devId],q=Math.max(1,+it.qty||1),vl=v(it.mount||d.mount);
    add('Công tắc '+p.k+' → '+d.name+' ×'+q,p.vs+(+it.dLamp||0)+q*vl,[1,1,pe],1+q);
    acc.lampPts+=q;acc.lamps.push({name:d.name,q});
    far=Math.max(far,vTu+p.d+p.vs+p.vs+(+it.dLamp||0)+vl);
    if(it.swType==='c2'){const s2=it.swm2||'sw';add('Công tắc 2 chiều '+p.k+' ↔ công tắc thứ 2',p.vs+v(s2)+(+it.dTrav||0),[3,0,0],2);acc.plates[p.k+'·2c·'+it.id]={n:1,swm:s2,types:['c2'],fan:[false],second:true};}
   });
  });
 }else if(c.type==='socket'){
  const its=[...items].sort((a,b)=>(+a.d||0)-(+b.d||0));
  its.forEach(it=>acc.sockets.push({n:Math.max(1,+it.nSock||1),type:it.sockType||'doi',wet:!!it.wet}));
  if(c.topo==='radial'||its.length===1&&c.topo!=='ring'){its.forEach((it,i)=>{const L=vTu+(+it.d||0)+v(it.mount);add('Tủ → ổ cắm '+(i+1),L,[1,1,pe],1,1);far=Math.max(far,L);});}
  else if(c.topo==='branch'){const dmax=Math.max(...its.map(i=>+i.d||0));add('Trục tủ → hộp nối các ổ cắm',vTu+dmax,[1,1,pe],2*its.length-1,1);
   its.forEach((it,i)=>{add('Hộp nối → ổ cắm '+(i+1),+st.brOff+v(it.mount),[1,1,pe],2);far=Math.max(far,vTu+(+it.d||0)+ +st.brOff+v(it.mount));});acc.jb+=its.length;}
  else{ // ring
   let tot=0;const L0=vTu+(+its[0].d||0)+v(its[0].mount);add('Vòng: tủ → ổ cắm 1',L0,[1,1,pe],1,1);tot+=L0;
   for(let i=0;i<its.length-1;i++){const L=v(its[i].mount)+Math.max(0,(+its[i+1].d||0)-(+its[i].d||0))+v(its[i+1].mount);add('Vòng: ổ cắm '+(i+1)+' → ổ cắm '+(i+2),L,[1,1,pe],2);tot+=L;}
   const n=its.length-1,Le=v(its[n].mount)+(+its[n].d||0)+vTu;add('Vòng: ổ cắm '+(n+1)+' → về tủ',Le,[1,1,pe],1,1);tot+=Le;far=tot/2;}
 }else{ // direct
  const it=items[0];if(it){const d=lib[it.devId],vd=v(it.mount||d.mount);
   if(it.sw){const vs=v('swPow');add('Tủ → công tắc công suất',vTu+(+it.d||0)+vs,[1,1,pe],1,1);
    const L2=Math.abs(hMount('swPow')-hMount(it.mount||d.mount))+(+st.swGap);add('Công tắc công suất → '+d.name,L2,[1,1,pe],2);acc.powSw++;far=vTu+(+it.d||0)+vs+L2;}
   else{const L=vTu+(+it.d||0)+vd;add('Tủ → '+d.name,L,[1,1,pe],2,1);acc.dbox++;far=L;}}
 }
 return {segs,acc,far};
}

function calcCircuit(c,lib){
 const st=ST(),U1=+st.U1,r={c,msgs:[]};
 const items=c.items.filter(it=>lib[it.devId]);
 if(c.items.length>items.length)r.msgs.push(['w',(c.items.length-items.length)+' dòng chưa chọn thiết bị']);
 if(!items.length){r.msgs.push(['w','Mạch chưa có thiết bị']);r.P=0;r.route=routeOf(c,lib);return r;}
 let P=0,Sx=0,rcd=false,imin=0;
 items.forEach(it=>{const d=lib[it.devId],q=c.type==='direct'?1:Math.max(0,+it.qty||0),p=d.P*q;P+=p;Sx+=p/(+d.cos||0.9);rcd=rcd||!!d.rcd;imin=Math.max(imin,+d.imin||0);
  if(d.kind!==({light:'light',socket:'plug',direct:'direct'})[c.type])r.msgs.push(['w',d.name+': thư viện xếp loại "'+KIND[d.kind]+'"']);
  if(c.type==='socket'&&d.P>+st.plugMax)r.msgs.push(['e',d.name+' '+d.P+'W > '+st.plugMax+'W: phải đi mạch riêng']);});
 if(c.type==='direct'&&c.items.length>1)r.msgs.push(['w','Mạch riêng chỉ nên có 1 thiết bị']);
 r.Pd=P;r.P=c.type==='socket'?P*(+st.ks||1):P;r.cos=P/Sx;
 r.Ib=r.P/(U1*r.cos);
 if(c.type==='socket'&&items.length>1)r.msgs.push(['i','P tính toán = ΣP × '+fmt(st.ks)+' (hệ số đồng thời trong mạch ổ cắm)']);
 const minCB=c.type==='light'?+st.minCBLight:c.type==='socket'?+st.minCBSock:(+st.directRule?+st.minCBDirect:10);
 r.Ireq=Math.max(r.Ib*st.kDev,minCB,imin);r.In=selCB(r.Ireq);
 r.rcd=c.type==='socket'?(!!+st.sockRCD||rcd):rcd;
 r.type=r.rcd?'RCBO 1P+N':'MCB 1P';
 if(!r.In){r.msgs.push(['e','Vượt bảng tra CB']);r.route=routeOf(c,lib);return r;}
 r.cb=r.type+' '+r.In+'A';
 r.route=routeOf(c,lib);
 const ring=c.topo==='ring'&&c.type==='socket';
 let minS=c.type==='light'?+st.minSLight:c.type==='socket'?+st.minSSock:(+st.directRule?+st.minSDirect:1.5);
 if(+st.vnRule&&r.In>=16)minS=Math.max(minS,2.5);
 const far=r.route.far;
 r.cab=selCable(r.In,ring?r.Ib/2:r.Ib,far,r.cos,U1,false,IZ.CV,+st.dUdev,minS,ring?+st.kRing:1);
 if(!r.cab){r.msgs.push(['e','Không có tiết diện phù hợp – tách mạch hoặc rút ngắn tuyến']);return r;}
 r.S=r.cab.S;r.PE=r.S;r.du=r.cab.du;
 if(r.cab.upDU)r.msgs.push(['i','Tăng tiết diện do sụt áp']);
 if(ring)r.msgs.push(['i','Mạch vòng: khả năng tải dây ×'+fmt(st.kRing)+', sụt áp tính với ½ dòng, ½ chiều dài vòng']);
 if(c.type==='direct'&&r.S>6)r.msgs.push(['w','Dây '+fmt(r.S)+'mm² > 6mm²: kiểm tra lại tải']);
 // dây & ống theo đoạn
 const wst=1+(+st.waste||0)/100,dp=1+(+st.dpOng||0)/100;
 r.wire={L:0,N:0,PE:0};r.pipes={};r.elb={};r.segs=[];
 for(const g of r.route.segs){
  const nw=g.n[0]+g.n[1]+g.n[2],cd=pickConduit(r.S,nw),Lc=g.L*dp;
  const w=[0,1,2].map(i=>(Lc*g.n[i]+g.n[i]*g.ends*(+st.chuaBox)+g.n[i]*g.panel*(+st.chuaTu))*wst);
  r.wire.L+=w[0];r.wire.N+=w[1];r.wire.PE+=w[2];
  r.pipes[cd.size]=(r.pipes[cd.size]||0)+Lc;r.elb[cd.size]=(r.elb[cd.size]||0)+(+st.elbowPerSeg||0);
  r.segs.push({...g,Lc,size:cd.size,fillPct:cd.fillPct,w});
  if(cd.over)r.msgs.push(['e','Đoạn "'+g.name+'": quá nhiều dây cho ống lớn nhất']);
 }
 return r;
}

function compute(){
 const st=ST(),lib=LIBM(),pr=S.project,U1=+st.U1,U3=+st.U3,three=pr.supply==='3P';
 const R={boards:[]};
 for(const b of pr.boards){
  const rb={b,circuits:[],msgs:[]};
  let Pd=0,Sd=0,maxP=0,maxIn=0,maxIb=0;
  for(const c of b.circuits){const r=calcCircuit(c,lib);rb.circuits.push(r);
   if(r.P>0){Pd+=r.P;Sd+=r.P/r.cos;maxP=Math.max(maxP,r.P);maxIb=Math.max(maxIb,r.Ib);if(r.In)maxIn=Math.max(maxIn,r.In);}}
  rb.Pd=Pd;rb.maxIn=maxIn;
  if(b.circuits.length>1&&((+b.kdt)<+st.kdtLo-1e-9||(+b.kdt)>+st.kdtHi+1e-9))rb.msgs.push(['w','k_đt = '+fmt(b.kdt)+' ngoài khoảng '+fmt(st.kdtLo)+'–'+fmt(st.kdtHi)]);
  if(Pd>0){
   rb.cos=Pd/Sd;rb.Ptt=Math.max((+b.kdt||1)*Pd,maxP);
   rb.Ib=Math.max(rb.Ptt/(U1*rb.cos),maxIb);
   rb.Ireq=Math.max(rb.Ib*st.kBr,nextCB(maxIn)||Infinity);rb.In=selCB(rb.Ireq);
   if(!rb.In)rb.msgs.push(['e','CB nhánh vượt bảng tra']);
   else{rb.cb='MCB 2P '+rb.In+'A';
    rb.cab=selCable(rb.In,rb.Ib,+b.len||0,rb.cos,U1,false,IZ.CVV2,+st.dUbr,+st.minSfeed);
    if(!rb.cab)rb.msgs.push(['e','Không có cáp trục phù hợp']);
    else{rb.S=rb.cab.S;rb.PE=peOf(rb.S);rb.wire='CVV 2×'+fmt(rb.S)+' + PE CV '+fmt(rb.PE);rb.conduit=conduitCVV(rb.S,3);rb.du=rb.cab.du;}}
  }else rb.msgs.push(['w','Tủ chưa có tải']);
  rb.modules=2+rb.circuits.reduce((a,r)=>a+(r.In?(r.rcd?2:1):0),0);
  rb.encl=ENCL.find(x=>x>=Math.ceil(rb.modules*1.2))||ENCL.at(-1);
  R.boards.push(rb);
 }
 const act=R.boards.filter(x=>x.Ptt>0),M={three,msgs:[]};R.main=M;
 const maxBrIn=Math.max(0,...act.map(x=>x.In||0));
 if(act.length){
  M.Pd=act.reduce((a,x)=>a+x.Pd,0);M.Psum=act.reduce((a,x)=>a+x.Ptt,0);
  if(!three){const Sx=act.reduce((a,x)=>a+x.Ptt/x.cos,0);M.Ptt=(+pr.kdt||1)*M.Psum;M.cos=M.Psum/Sx;M.Ib=M.Ptt/(U1*M.cos);}
  else{M.phase={};['A','B','C'].forEach(p=>{const xs=act.filter(x=>(x.b.phase||'A')===p),P=xs.reduce((a,x)=>a+x.Ptt,0),Sx=xs.reduce((a,x)=>a+x.Ptt/x.cos,0),Pt=(+pr.kdt||1)*P;M.phase[p]={P:Pt,cos:Sx?P/Sx:1,I:Sx?Pt/(U1*(P/Sx)):0};});
   const Is=['A','B','C'].map(p=>M.phase[p].I),avg=(Is[0]+Is[1]+Is[2])/3;
   M.Ptt=['A','B','C'].reduce((a,p)=>a+M.phase[p].P,0);M.cos=M.Psum/act.reduce((a,x)=>a+x.Ptt/x.cos,0);M.Ib=Math.max(...Is);M.unbal=avg?(Math.max(...Is)-Math.min(...Is))/avg*100:0;
   if(M.unbal>20)M.msgs.push(['w','Lệch pha '+fmt(M.unbal,0)+'% > 20%: bấm "Tự cân pha"']);}
  M.Ireq=Math.max(M.Ib*st.kMain,maxBrIn);M.In=selCB(M.Ireq);
  if(!three){const cap=+st.cbMax1P;M.cap=cap;M.kdtMax=Math.floor(cap/st.kMain*U1*M.cos/M.Psum*100)/100;
   if(M.In&&M.In>cap){M.over=true;M.msgs.push(['e','CB tổng '+M.In+'A > '+cap+'A (CB điện lực tại công tơ). Giảm k_đt toàn nhà ≤ '+fmt(M.kdtMax)+' hoặc xin cấp 3 pha']);}
   if(maxBrIn>cap)M.msgs.push(['e','Có CB nhánh '+maxBrIn+'A > '+cap+'A']);
   if(M.kdtMax<0.4)M.msgs.push(['w','k_đt toàn nhà cho phép chỉ '+fmt(M.kdtMax)+' – quá thấp: rà lại công suất hoặc xin cấp 3 pha']);}
  if(!M.In)M.msgs.push(['e','CB tổng vượt bảng tra']);
  else{M.cb=(three?'MCCB 4P ':'MCCB/MCB 2P ')+M.In+'A';
   M.cab=three?selCable(M.In,M.Ib,+pr.len||0,M.cos,U3,true,IZ.CVV3,+st.dUmain,+st.minSfeed):selCable(M.In,M.Ib,+pr.len||0,M.cos,U1,false,IZ.CVV2,+st.dUmain,+st.minSfeed);
   if(!M.cab)M.msgs.push(['e','Không có cáp nguồn phù hợp']);
   else{M.S=M.cab.S;M.PE=peOf(M.S);M.wire=(three?'CVV 4×':'CVV 2×')+fmt(M.S)+' + PE CV '+fmt(M.PE);M.conduit=conduitCVV(M.S,three?5:3);M.du=M.cab.du;}}
  M.modules=(three?4:2)+act.length*2+(+st.spd?(three?4:2)*2:0);
  M.encl=ENCL.find(x=>x>=Math.ceil(M.modules*1.2))||ENCL.at(-1);
 }
 for(const rb of R.boards){
  if(M.In&&rb.In&&M.In===rb.In)rb.msgs.push(['i','CB nhánh bằng CB tổng – chọn lọc kém']);
  for(const r of rb.circuits){if(r.du==null)continue;r.duTot=(M.du||0)+(rb.du||0)+r.du;if(r.duTot>+st.dUtot)r.msgs.push(['e','ΔU tổng '+fmt(r.duTot,2)+'% > '+st.dUtot+'%']);}
 }
 return R;
}

/* =========================================================
   BÓC VẬT TƯ
   ========================================================= */
const BOM_CAT={A:'A. Thiết bị đóng cắt & bảo vệ',B:'B. Tủ điện & phụ kiện tủ',C:'C. Dây, cáp & đầu cos',D:'D. Ống luồn & phụ kiện ống',E:'E. Công tắc – ổ cắm – đế âm – hộp nối',F:'F. Tiếp địa & chống sét',G:'G. Đèn & quạt (thiết bị chiếu sáng)'};
const COLOR={L:'pha L (đỏ/nâu)',N:'trung tính N (xanh dương/đen)',PE:'tiếp địa PE (vàng sọc xanh)'};
function bom(R,only){
 const st=ST(),w=1+(+st.waste||0)/100,items={},lib=LIBM();
 const add=(cat,name,unit,q,where)=>{if(!(q>0))return;const k=cat+'|'+name;if(!items[k])items[k]={cat,name,unit,q:0,w:new Set()};items[k].q+=q;if(where)items[k].w.add(where);};
 const pipeFit=(size,Lc,elb,where)=>{add('D','Ống PVC cứng '+size,'m',Lc,where);add('D','Măng sông nối ống '+size,'Cái',Math.ceil(Lc/(+st.pipeLen||2.92)),where);add('D','Kẹp đỡ ống '+size,'Cái',Math.ceil(Lc*(+st.clampPerM||0)),where);add('D','Cút 90° '+size,'Cái',elb,where);};
 const cos=(s,n,where)=>{if(s>=+st.cosMinS)add('C','Đầu cos đồng '+fmt(s)+' mm²','Cái',n,where);};
 const wire=(s,col,m,where)=>add('C','Dây CV '+fmt(s)+' mm² – '+COLOR[col],'m',m,where);
 const encl=(mod,label,where)=>{add('B',label+' ≥ '+mod+' module','Cái',1,where);add('B','Thanh cái / cầu đấu trung tính N','Bộ',1,where);add('B','Thanh cái / cầu đấu tiếp địa PE','Bộ',1,where);add('B','Nhãn lộ, máng đi dây trong tủ','Bộ',1,where);};
 const M=R.main,pr=S.project,three=pr.supply==='3P',dp=1+(+st.dpOng||0)/100;
 if(!only){
  const nm='Tủ tổng';
  if(M.In)add('A',M.cb,'Cái',1,nm);
  if(M.S){const L=+pr.len||0;add('C',(three?'Cáp CVV 4×':'Cáp CVV 2×')+fmt(M.S)+' mm²','m',L*w,'Cáp nguồn');wire(M.PE,'PE',L*w,'Cáp nguồn');pipeFit(M.conduit,L*dp,2,'Cáp nguồn');cos(M.S,(three?4:2)*2,nm);cos(M.PE,2,nm);}
  if(M.encl)encl(M.encl,'Vỏ tủ điện tổng',nm);
  if(+st.spd){add('F',three?'Chống sét lan truyền SPD 4P (Type 2)':'Chống sét lan truyền SPD 2P (Type 2)','Cái',1,nm);add('A',(three?'MCB 4P':'MCB 2P')+' 32A (bảo vệ SPD)','Cái',1,nm);}
  if(+st.earth){add('F','Cọc tiếp địa thép mạ đồng D16 L=2,4m','Cọc',+st.rods,'Hệ tiếp địa');add('F','Cáp đồng trần C'+st.bareS,'m',+st.bareLen,'Hệ tiếp địa');
   add('F','Mối hàn hóa nhiệt','Mối',+st.rods,'Hệ tiếp địa');add('F','Hộp kiểm tra tiếp địa','Cái',1,'Hệ tiếp địa');wire(+st.bareS,'PE',(+st.earthLen||0)*w,'Hệ tiếp địa');}
 }
 for(const rb of R.boards){
  const b=rb.b,nm=b.name;if(only&&only!==b.id)continue;
  if(rb.In)add('A',rb.cb,'Cái',only?1:2,only?nm:'Tủ tổng + đầu '+nm);
  if(rb.S){const L=+b.len||0;add('C','Cáp CVV 2×'+fmt(rb.S)+' mm²','m',L*w,nm);wire(rb.PE,'PE',L*w,nm);pipeFit(rb.conduit,L*dp,2,nm);cos(rb.S,4,nm);cos(rb.PE,2,nm);}
  if(rb.Pd>0)encl(rb.encl,'Vỏ tủ điện nhánh',nm);
  for(const r of rb.circuits){
   const c=r.c,cn=nm+' / '+c.name;
   if(r.In)add('A',r.cb+' (C)','Cái',1,nm);
   if(r.S){wire(r.S,'L',r.wire.L,cn);wire(r.S,'N',r.wire.N,cn);wire(r.S,'PE',r.wire.PE,cn);
    for(const sz in r.pipes)pipeFit(sz,r.pipes[sz],r.elb[sz],cn);
    cos(r.S,(c.topo==='ring'?2:1)*(r.route.segs[0]?r.route.segs[0].n.reduce((a,x)=>a+x,0):3),nm);}
   const A=r.route?r.route.acc:null;if(!A)continue;
   if(A.jb)add('E','Hộp nối dây (hộp chia ngã)','Cái',A.jb,cn);
   // bảng công tắc
   for(const k in A.plates){const p=A.plates[k];let n=p.n;
    while(n>0){const g=Math.min(4,n);add('E','Mặt công tắc '+g+' hạt','Cái',1,cn);add('E','Đế âm tường','Cái',1,cn);n-=g;}
    p.types.forEach((t,i)=>{if(t==='c1')add('E','Hạt công tắc 1 chiều 16A','Cái',1,cn);else if(t==='c2')add('E','Hạt công tắc 2 chiều 16A','Cái',1,cn);else add('E',p.fan[i]?'Hạt chiết áp quạt':'Hạt chiết áp đèn (dimmer)','Cái',1,cn);});}
   // ổ cắm
   A.sockets.forEach(s=>{const nm2=(s.type==='don'?'Ổ cắm đơn':'Ổ cắm đôi')+' 3 chấu 16A'+(s.wet?' – chống nước (có nắp IP44/IP55)':'');add('E',nm2,'Cái',s.n,cn);add('E',s.wet?'Đế/hộp ổ cắm chống nước':'Đế âm tường','Cái',s.n,cn);});
   if(A.powSw){const a=r.In<=20?20:30;add('E','Công tắc công suất lớn '+a+'A (có đèn báo) + mặt','Cái',A.powSw,cn);add('E','Đế âm tường','Cái',A.powSw,cn);if(r.In>32)add('E','⚠ CB > 32A – không dùng công tắc công suất, đấu qua CB','Ghi chú',1,cn);}
   if(A.dbox)add('E','Hộp đấu nối thiết bị (domino/ổ cắm công suất)','Cái',A.dbox,cn);
   A.lamps.forEach(l=>add('G',l.name,'Bộ',l.q,cn));
   if(A.lampPts)add('E','Điểm đấu đèn (domino/cút nối nhanh)','Điểm',A.lampPts,cn);
  }
 }
 return Object.values(items).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name,'vi',{numeric:true}));
}

function fmt(x,d){if(x==null||isNaN(x))return '';if(d==null)return String(+(+x).toFixed(2)).replace('.',',');return (+x).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msgs(a){return a&&a.length?'<div class="msg">'+a.map(m=>'<div class="'+m[0]+'">'+(m[0]==='e'?'✖ ':m[0]==='w'?'⚠ ':'ℹ ')+esc(m[1])+'</div>').join('')+'</div>':'';}
function status(a){if(!a||!a.length)return '<span class="pill p-ok">OK</span>';if(a.some(m=>m[0]==='e'))return '<span class="pill p-e">Lỗi</span>';if(a.some(m=>m[0]==='w'))return '<span class="pill p-w">Lưu ý</span>';return '<span class="pill p-ok">OK</span>';}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),1800);}
const A=(o)=>Object.entries(o).map(([k,v])=>'data-'+k+'="'+esc(v)+'"').join(' ');
function inp(k,val,attrs,w){return '<input data-k="'+k+'" '+attrs+' type="text" value="'+esc(val)+'"'+(w?' style="width:'+w+'px"':'')+'>';}
function num(k,val,attrs,step,w){return '<input data-k="'+k+'" '+attrs+' type="number" step="'+(step||'any')+'" min="0" value="'+esc(val)+'"'+(w?' style="width:'+w+'px"':'')+'>';}
function sel(k,cur,opts,attrs,w){return '<select data-k="'+k+'" '+attrs+(w?' style="max-width:'+w+'px"':'')+'>'+Object.entries(opts).map(([v,l])=>'<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';}
function chk(k,on,attrs){return '<input data-k="'+k+'" '+attrs+' type="checkbox"'+(on?' checked':'')+'>';}
function devSelect(k,cur,attrs,kind){
 const g={};S.library.filter(d=>!kind||d.kind===kind||d.id===cur).forEach(d=>{(g[d.group||'Khác']=g[d.group||'Khác']||[]).push(d);});
 let h='<select data-k="'+k+'" '+attrs+' style="max-width:250px"><option value="">— chọn —</option>';
 for(const n in g)h+='<optgroup label="'+esc(n)+'">'+g[n].map(d=>'<option value="'+d.id+'"'+(d.id===cur?' selected':'')+'>'+esc(d.name)+' ('+d.P+'W)</option>').join('')+'</optgroup>';
 return h+'</select>';

let bomFilter='';
const price=n=>+((S.prices||{})[n]||0);
function bomTable(items){
 const st=ST(),roll=+st.roll||100;let rows=[],sum=0,i=0,cat='';
 for(const it of items){
  if(it.cat!==cat){cat=it.cat;rows.push({h:BOM_CAT[cat]});}
  const q=it.unit==='m'?Math.ceil(it.q):Math.ceil(it.q-1e-9),pr=price(it.name),tt=q*pr;sum+=tt;
  const note=/^Dây CV/.test(it.name)?'≈ '+Math.ceil(q/roll-1e-9)+' cuộn '+roll+'m':'';
  rows.push({i:++i,cat:BOM_CAT[cat],name:it.name,unit:it.unit,q,pr,tt,note,w:[...it.w].join(', ')});
 }
 const aux=sum*(+st.auxPct||0)/100;
 return {rows,sum,aux,total:sum+aux};
}

function setCtl(k,t,st){
 const at='data-f="s" data-s="'+k+'"';
 if(t==='temp')return sel('s.'+k,st[k],Object.fromEntries(Object.keys(KTEMP).map(x=>[x,x])),at);
 if(t==='sec')return sel('s.'+k,st[k],Object.fromEntries(SECTIONS.slice(0,4).map(x=>[x,fmt(x)])),at);
 if(t==='sec2')return sel('s.'+k,st[k],Object.fromEntries([2.5,4,6,10].map(x=>[x,fmt(x)])),at);
 if(t==='cb')return sel('s.'+k,st[k],Object.fromEntries([6,10,16,20,25,32].map(x=>[x,x])),at);
 if(t==='cbmax')return sel('s.'+k,st[k],Object.fromEntries([40,50,63,80,100].map(x=>[x,x])),at);
 if(t==='yn')return sel('s.'+k,+st[k]?1:0,{1:'Có / áp dụng',0:'Không'},at);
 return num('s.'+k,st[k],at,t);
}

let R;
function renderAll(){
 const ae=document.activeElement,k=ae&&ae.dataset?ae.dataset.k:null;
 R=compute();
 document.getElementById('hdrPrj').textContent=S.project.name+' – '+(S.project.supply==='3P'?'3 pha 380V':'1 pha 220V');
 const set=(id,html)=>document.getElementById(id).innerHTML=html;
 set('design',renderDesign(R));set('sld',renderSLD(R));set('result',renderResult(R));set('qty',renderQty(R));set('bom',renderBOM(R));set('lib',renderLib());set('set',renderSet());set('help',renderHelp());
 if(k){const el=document.querySelector('[data-k="'+CSS.escape(k)+'"]');if(el)el.focus();}
}
const findB=id=>S.project.boards.find(b=>b.id===id);
const findC=(b,c)=>findB(b).circuits.find(x=>x.id===c);
function newItem(type){
 const st=ST();
 if(type==='light')return {id:uid(),devId:'',qty:1,plate:'CT1',swType:'c1',swm:'sw',mount:'ceil',dSw:5,dLamp:4,dTrav:0};
 if(type==='socket')return {id:uid(),devId:'',qty:1,nSock:1,sockType:'doi',wet:false,mount:'sk',d:5};
 return {id:uid(),devId:'',qty:1,mount:'ac',d:6,sw:false};
}
document.addEventListener('change',e=>{
 const t=e.target,f=t.dataset.f;if(!f)return;
 const v=t.type==='checkbox'?t.checked:(t.type==='number'?(t.value===''?0:+t.value):t.value);
 const D=t.dataset;
 if(f.startsWith('prj.'))S.project[f.slice(4)]=v;
 else if(f.startsWith('b.'))findB(D.b)[f.slice(2)]=v;
 else if(f.startsWith('c.'))findC(D.b,D.c)[f.slice(2)]=v;
 else if(f.startsWith('i.')){const c=findC(D.b,D.c),it=c.items.find(x=>x.id===D.i);it[f.slice(2)]=v;
  if(f==='i.devId'){const d=S.library.find(x=>x.id===v);if(d){it.mount=d.mount;if(c.type==='socket'&&d.mount==='skOut')it.wet=true;}}}
 else if(f.startsWith('d.')){const d=S.library.find(x=>x.id===D.id);d[f.slice(2)]=v;}
 else if(f==='s'){S.settings[D.s]=+v;}
 else if(f==='m'){S.settings.mount[D.m]=+v;}
 else if(f==='price'){if(+v>0)S.prices[D.n]=+v;else delete S.prices[D.n];}
 else if(f==='bomFilter'){bomFilter=v;renderAll();return;}
 save();renderAll();
});
document.addEventListener('click',e=>{
 const t=e.target.closest('[data-act],[data-tab]');if(!t)return;
 if(t.dataset.tab){document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('on',x===t));document.querySelectorAll('main section').forEach(s=>s.classList.toggle('on',s.id===t.dataset.tab));window.scrollTo(0,0);return;}
 const a=t.dataset.act,pr=S.project,bs=pr.boards,D=t.dataset,bi=bs.findIndex(b=>b.id===D.b),b=bs[bi];
 switch(a){
  case 'addB':bs.push({id:uid(),name:'Tủ nhánh mới',kdt:0.7,len:15,phase:'A',circuits:[]});break;
  case 'delB':if(!confirm('Xóa tủ "'+b.name+'"?'))return;bs.splice(bi,1);break;
  case 'dupB':{const c=JSON.parse(JSON.stringify(b));c.id=uid();c.name+=' (bản sao)';c.circuits.forEach(x=>{x.id=uid();x.items.forEach(i=>i.id=uid());});bs.splice(bi+1,0,c);break;}
  case 'up':if(bi>0)[bs[bi-1],bs[bi]]=[bs[bi],bs[bi-1]];break;
  case 'down':if(bi<bs.length-1)[bs[bi+1],bs[bi]]=[bs[bi],bs[bi+1]];break;
  case 'addC':{const ty=D.type;b.circuits.push({id:uid(),type:ty,name:({light:'Mạch chiếu sáng',socket:'Mạch ổ cắm',direct:'Mạch riêng'})[ty]+' '+(b.circuits.filter(x=>x.type===ty).length+1),topo:ty==='socket'?'branch':ty==='light'?'branch':'radial',route:'tran',items:[newItem(ty)]});break;}
  case 'delC':if(!confirm('Xóa mạch?'))return;b.circuits=b.circuits.filter(x=>x.id!==D.c);break;
  case 'dupC':{const i=b.circuits.findIndex(x=>x.id===D.c),c=JSON.parse(JSON.stringify(b.circuits[i]));c.id=uid();c.name+=' (bản sao)';c.items.forEach(x=>x.id=uid());b.circuits.splice(i+1,0,c);break;}
  case 'addI':{const c=findC(D.b,D.c),last=c.items.at(-1),n=newItem(c.type);if(last){if(c.type==='light'){n.plate=last.plate;n.dSw=last.dSw;}else n.d=(+last.d||0)+2;}c.items.push(n);break;}
  case 'delI':{const c=findC(D.b,D.c);c.items=c.items.filter(x=>x.id!==D.i);break;}
  case 'balance':{const act=R.boards.filter(x=>x.Ptt>0).sort((x,y)=>y.Ptt-x.Ptt),load={A:0,B:0,C:0};act.forEach(x=>{const p=['A','B','C'].sort((m,n)=>load[m]-load[n])[0];x.b.phase=p;load[p]+=x.Ptt;});toast('Đã cân pha');break;}
  case 'applyKdt':pr.kdt=Math.max(0.01,R.main.kdtMax);toast('k_đt toàn nhà = '+fmt(pr.kdt));break;
  case 'addDev':S.library.push({id:uid(),group:'Khác',name:'Thiết bị mới',P:100,cos:0.9,kind:'plug',mount:'sk',rcd:false,imin:0,note:''});break;
  case 'delDev':S.library=S.library.filter(d=>d.id!==D.id);break;
  case 'resetLib':if(!confirm('Khôi phục thư viện mặc định? Thiết bị tự thêm sẽ mất.'))return;
   {const old={};S.library.forEach(d=>old[d.id]=d.name);S.library=defLib();const by={};S.library.forEach(d=>by[d.name]=d.id);bs.forEach(b=>b.circuits.forEach(c=>c.items.forEach(i=>i.devId=by[old[i.devId]]||'')));}break;
  case 'resetSet':S.settings={...DEF_SET,mount:{...DEF_MOUNT}};break;
  case 'new':if(!confirm('Tạo dự án mới (trống)? Hãy Lưu .json dự án hiện tại trước nếu cần.'))return;
   S.project={name:'Dự án mới',supply:'1P',kdt:0.8,len:15,boards:[{id:uid(),name:'Tủ nhánh 1',kdt:0.7,len:15,phase:'A',circuits:[]}]};break;
  case 'open':document.getElementById('fileOpen').click();return;
  case 'saveJson':download(JSON.stringify(S,null,1),fname('json'),'application/json');return;
  case 'xls':exportXLS();return;
  case 'print':window.print();return;
 }
 save();renderAll();
});
document.getElementById('fileOpen').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!isV2(o)){alert('File này là dự án phiên bản cũ (chưa chia mạch chiếu sáng / ổ cắm / riêng) nên không mở được trực tiếp. Hãy tạo lại tủ và mạch theo cấu trúc mới.');return;}S=normalize(o);save();renderAll();toast('Đã mở '+f.name);}catch(x){alert('File không đúng định dạng.');}};
 rd.readAsText(f,'utf-8');e.target.value='';
});
function fname(ext){return (S.project.name||'du-an').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w-]+/g,'_')+'.'+ext;}
function download(data,name,type){const b=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* =========================================================
   XUẤT EXCEL (SpreadsheetML)
   ========================================================= */
function exportXLS(){
 const x=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const cell=v=>{if(typeof v==='number'&&isFinite(v))return '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>';
  const n=typeof v==='string'&&v!==''&&/^-?\d{1,3}(\.\d{3})*(,\d+)?$|^-?\d+(,\d+)?$/.test(v)?+v.replace(/\./g,'').replace(',','.'):null;
  return n!==null?'<Cell><Data ss:Type="Number">'+n+'</Data></Cell>':'<Cell><Data ss:Type="String">'+x(v)+'</Data></Cell>';};
 const sheet=(name,hdr,rows)=>'<Worksheet ss:Name="'+x(name)+'"><Table><Row>'+hdr.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+x(h)+'</Data></Cell>').join('')+'</Row>'+rows.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')+'</Table></Worksheet>';
 const st=ST(),pr=S.project,T=bomTable(bom(R,''));
 const info=[['Dự án',pr.name],['Nguồn',pr.supply==='3P'?'3 pha 380V':'1 pha 220V'],['k_đt toàn nhà',pr.kdt],['Nhiệt độ (°C)',st.temp],['Trần BT (m)',st.Hc],['Trần giả (m)',st.Hf],['Trục tường (m)',st.Htruc],['Tủ điện (m)',st.Htu],['Dự phòng ống (%)',st.dpOng],['Hao hụt dây (%)',st.waste],['Ngày xuất',new Date().toLocaleString('vi-VN')]];
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
  '<Styles><Style ss:ID="Default"><Font ss:FontName="Arial" ss:Size="10"/></Style><Style ss:ID="h"><Font ss:FontName="Arial" ss:Bold="1"/><Interior ss:Color="#DDEBF7" ss:Pattern="Solid"/></Style></Styles>'+
  sheet('Thong_tin',['Mục','Giá trị'],info)+sheet('Ket_qua',RES_HDR,resultRows(R))+sheet('Khoi_luong_day_ong',QTY_HDR,qtyRows(R))+
  sheet('Boc_vat_tu',['STT','Nhóm','Tên vật tư / quy cách','ĐVT','Khối lượng','Quy đổi','Đơn giá (đ)','Thành tiền (đ)','Vị trí'],T.rows.filter(r=>!r.h).map(r=>[r.i,r.cat,r.name,r.unit,r.q,r.note,r.pr||'',r.tt||'',r.w]).concat([['','','Cộng vật tư chính','','','','',T.sum,''],['','','Vật tư phụ '+st.auxPct+'%','','','','',Math.round(T.aux),''],['','','TỔNG CỘNG (chưa VAT)','','','','',Math.round(T.total),'']]))+
  sheet('Cao_do',['Vị trí lắp','Cao độ (m)'],MOUNTS.map(m=>[m[1],hMount(m[0])]))+
  sheet('Thu_vien',['Nhóm','Tên','P (W)','Cosφ','Kiểu cấp nguồn','Vị trí lắp','Chống giật','CB tối thiểu (A)','Ghi chú'],S.library.map(d=>[d.group,d.name,+d.P,+d.cos,KIND[d.kind],MOUNT_LBL[d.mount]||d.mount,d.rcd?'Có':'Không',+d.imin,d.note]))+
  '</Workbook>';
 download(xml,fname('xls'),'application/vnd.ms-excel');toast('Đã xuất Excel');
}
renderAll();
</script>
