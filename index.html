<title>Tính chọn Aptomat & Dây dẫn – Nhà dân dụng</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#dde3ea;--ink:#1f2933;--mute:#66788a;--acc:#1f5fa8;--acc2:#e8f0fb;--ok:#1e7d32;--warn:#b26a00;--err:#c62828;--inp:#fffdf2}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
header{background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;flex:1;min-width:240px}
header h1 small{display:block;font-weight:normal;opacity:.8;font-size:11px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 10px;border-radius:5px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{padding:2px 7px;font-size:12px}
button.del{color:var(--err);border-color:transparent;background:transparent}
button.del:hover{border-color:var(--err)}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
nav{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:9;overflow-x:auto}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 14px;background:none;white-space:nowrap}
nav button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:bold}
main{padding:14px 16px;max-width:1500px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card>.hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafbfd;border-radius:8px 8px 0 0}
.card>.hd h3{margin:0;font-size:14px}
.card>.bd{padding:10px 12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:8px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
input,select{font:inherit;padding:4px 6px;border:1px solid #c9d2dc;border-radius:4px;background:var(--inp);color:var(--ink);min-width:0}
input[type=number]{width:80px}
input.w{width:100%}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
th{background:#f0f3f7;font-weight:bold;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
td.c{text-align:center}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:bold}
.p-ok{background:#e6f4ea;color:var(--ok)}.p-w{background:#fff3e0;color:var(--warn)}.p-e{background:#fdecea;color:var(--err)}
.msg{font-size:11.5px;line-height:1.35}
.msg .e{color:var(--err)}.msg .w{color:var(--warn)}.msg .i{color:var(--mute)}
.res{font-weight:bold;color:var(--acc)}
.sum{display:flex;flex-wrap:wrap;gap:6px 18px;font-size:12.5px}
.sum b{color:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kpi div{background:var(--acc2);border-radius:6px;padding:8px 10px}
.kpi small{display:block;color:var(--mute);font-size:11px}
.kpi b{font-size:15px}
.hint{color:var(--mute);font-size:12px;margin:4px 0 0}
/* so do */
.sld{display:flex;flex-direction:column;align-items:center}
.box{border:2px solid var(--acc);border-radius:8px;background:#fff;padding:8px 12px;text-align:center;min-width:240px}
.box h4{margin:0 0 4px;font-size:13px}
.vline{width:2px;height:22px;background:var(--acc)}
.bus{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;border-top:2px solid var(--acc);padding-top:0;width:100%}
.br{display:flex;flex-direction:column;align-items:center;min-width:220px;max-width:280px}
.br .box{border-color:#5b8bc6;min-width:210px}
.br ul{list-style:none;margin:6px 0 0;padding:0;width:100%}
.br li{border:1px solid var(--line);border-left:3px solid #5b8bc6;border-radius:4px;padding:4px 6px;margin-bottom:4px;background:#fff;font-size:11.5px}
.br li.rcd{border-left-color:#d08700}
.legend{font-size:11.5px;color:var(--mute);margin-top:10px;text-align:center}
.ph{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:bold;text-align:center}
.phA{background:#c62828}.phB{background:#f9a825}.phC{background:#1565c0}
.doc h3{margin:16px 0 6px}.doc p,.doc li{line-height:1.5}
.toast{position:fixed;bottom:18px;right:18px;background:#263238;color:#fff;padding:9px 14px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:.95}
@media print{
 header,nav,.noprint,button{display:none!important}
 body{background:#fff;font-size:11px}
 main{padding:0;max-width:none}
 .card{break-inside:avoid;border-color:#999}
 input,select{border:none;background:none;padding:0;appearance:none}
}
</style>

/* ===================== DỰ ÁN MẪU ===================== */
function sampleProject(lib){
 const id=n=>{const d=lib.find(x=>x.name===n);return d?d.id:'';};
 const L=(n,len,q)=>({id:uid(),devId:id(n),qty:q||1,len:len});

/* ===================== TRẠNG THÁI ===================== */
const KEY='dien-dan-dung-v1';
let S;
function uid(){return 'x'+Math.random().toString(36).slice(2,10);}
function fresh(){const lib=defLib();return {settings:{...DEF_SET},library:lib,project:sampleProject(lib)};}
function load(){try{const t=localStorage.getItem(KEY);if(t){const o=JSON.parse(t);if(o&&o.project&&o.library){o.settings={...DEF_SET,...o.settings};return o;}}}catch(e){}return fresh();}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S));}catch(e){}}
S=load();

/* ===================== TÍNH TOÁN ===================== */
const ST=()=>S.settings;
const kt=()=>(KTEMP[ST().temp]||1)*(+ST().kgrp||1);
const selCB=I=>RATINGS.find(r=>r>=I-1e-9)||null;
const nextCB=r=>RATINGS.find(x=>x>r)||null;
const peOf=s=>s<=16?s:(s<=35?16:SECTIONS.find(x=>x>=s/2));
function dU(L,I,s,cos,U,three){const sin=Math.sqrt(Math.max(0,1-cos*cos));return (three?Math.sqrt(3):2)*L*I*(RHO/s*cos+XL*sin)/U*100;}
function selCable(In,Ib,L,cos,U,three,tbl,dUmax,minS){
 let up=false;
 for(const s of SECTIONS){
  if(s<minS)continue;
  const iz=tbl[s]*kt();
  if(iz<In)continue;
  const du=dU(L,Ib,s,cos,U,three);
  if(du>dUmax){up=true;continue;}
  return {S:s,iz,du,upDU:up};
 }
 return null;
}
const conduitCV=s=>s<=1.5?'D16':s<=2.5?'D20':s<=4?'D25':s<=10?'D32':s<=25?'D40':'D50';
function conduitCVV(s,cores){const t=[[2.5,'D20'],[6,'D25'],[16,'D32'],[35,'D40'],[50,'D50'],[999,'D63']];let i=t.findIndex(x=>s<=x[0]);if(cores>=4)i=Math.min(i+1,t.length-1);return t[i][1];}

function compute(){
 const st=ST(),lib={},pr=S.project;S.library.forEach(d=>lib[d.id]=d);
 const U1=+st.U1,U3=+st.U3,three=pr.supply==='3P';
 const R={boards:[],main:null,warnings:[]};
 for(const b of pr.boards){
  const rb={b,loads:[],msgs:[]};
  let Pd=0,Sd=0,maxP=0,maxIn=0,maxIb=0;
  for(const ld of b.loads){
   const d=lib[ld.devId];const r={ld,d,msgs:[]};rb.loads.push(r);
   if(!d){r.msgs.push(['e','Chưa chọn thiết bị']);continue;}
   const qty=Math.max(0,+ld.qty||0),len=Math.max(0,+ld.len||0);
   r.P=d.P*qty;r.cos=+d.cos||0.9;
   if(r.P<=0){r.msgs.push(['w','Công suất = 0']);continue;}
   r.Ib=r.P/(U1*r.cos);r.Ireq=Math.max(r.Ib*st.kDev,+d.imin||0,+st.minCB||0);r.In=selCB(r.Ireq);
   r.type=(d.rcd?'RCBO 1P+N':'MCB 1P');
   if(!r.In){r.msgs.push(['e','Vượt bảng tra CB (>'+RATINGS.at(-1)+'A)']);continue;}
   r.cb=r.type+' '+r.In+'A ('+d.curve+')';
   r.cab=selCable(r.In,r.Ib,len,r.cos,U1,false,IZ.CV,+st.dUdev,Math.max(+st.minSdev,(+st.vnRule&&r.In>=16)?2.5:0));
   if(!r.cab){r.msgs.push(['e','Không có tiết diện CV phù hợp – giảm chiều dài hoặc tách lộ']);}
   else{r.S=r.cab.S;r.PE=peOf(r.S);r.wire='CV 2×'+fmt(r.S)+' + PE '+fmt(r.PE);r.conduit=conduitCV(r.S);r.du=r.cab.du;
    if(r.cab.upDU)r.msgs.push(['i','Tăng tiết diện do sụt áp']);}
   if(d.imin&&r.Ib*st.kDev<d.imin)r.msgs.push(['i','Theo CB tối thiểu '+d.imin+'A']);
   Pd+=r.P;Sd+=r.P/r.cos;maxP=Math.max(maxP,r.P);maxIn=Math.max(maxIn,r.In);maxIb=Math.max(maxIb,r.Ib);
  }
  rb.Pd=Pd;rb.maxIn=maxIn;
  if(rb.loads.length>1&&((+b.kdt)<+st.kdtLo-1e-9||(+b.kdt)>+st.kdtHi+1e-9))rb.msgs.push(['w','k_đt = '+fmt(b.kdt)+' ngoài khoảng khuyến nghị '+fmt(st.kdtLo)+'–'+fmt(st.kdtHi)]);
  if(Pd>0){
   rb.cos=Pd/Sd;rb.Ptt=Math.max((+b.kdt||1)*Pd,maxP);
   if((+b.kdt||1)*Pd<maxP)rb.msgs.push(['i','Ptt lấy bằng thiết bị lớn nhất']);
   rb.Ib=Math.max(rb.Ptt/(U1*rb.cos),maxIb);
   rb.Ireq=Math.max(rb.Ib*st.kBr,nextCB(maxIn)||Infinity);
   rb.In=selCB(rb.Ireq);
   if(!rb.In){rb.msgs.push(['e','CB nhánh vượt bảng tra – tách tủ hoặc cấp 3 pha']);}
   else{
    rb.cb='MCB 2P '+rb.In+'A';
    rb.cab=selCable(rb.In,rb.Ib,+b.len||0,rb.cos,U1,false,IZ.CVV2,+st.dUbr,+st.minSfeed);
    if(!rb.cab)rb.msgs.push(['e','Không có cáp trục phù hợp']);
    else{rb.S=rb.cab.S;rb.PE=peOf(rb.S);rb.wire='CVV 2×'+fmt(rb.S)+' + PE CV '+fmt(rb.PE);rb.conduit=conduitCVV(rb.S,3);rb.du=rb.cab.du;
     if(rb.cab.upDU)rb.msgs.push(['i','Tăng tiết diện cáp trục do sụt áp']);}
   }
  }else rb.msgs.push(['w','Tủ chưa có thiết bị']);
  // module tủ nhánh
  rb.modules=2+rb.loads.reduce((a,r)=>a+(r.In?(r.d.rcd?2:1):0),0);
  rb.encl=ENCL.find(x=>x>=Math.ceil(rb.modules*1.2))||ENCL.at(-1);
  R.boards.push(rb);
 }
 // ===== TỦ TỔNG =====
 const act=R.boards.filter(x=>x.Ptt>0);
 const M={three,msgs:[]};R.main=M;
 const maxBrIn=Math.max(0,...act.map(x=>x.In||0));
 if(act.length){
  if(!three){
   const P=act.reduce((a,x)=>a+x.Ptt,0),Sx=act.reduce((a,x)=>a+x.Ptt/x.cos,0);
   M.Pd=act.reduce((a,x)=>a+x.Pd,0);M.Psum=P;M.Ptt=(+pr.kdt||1)*P;M.cos=P/Sx;M.Ib=M.Ptt/(U1*M.cos);
  }else{
   M.phase={};['A','B','C'].forEach(p=>{const xs=act.filter(x=>(x.b.phase||'A')===p);const P=xs.reduce((a,x)=>a+x.Ptt,0),Sx=xs.reduce((a,x)=>a+x.Ptt/x.cos,0);
    const Pt=(+pr.kdt||1)*P;M.phase[p]={P:Pt,cos:Sx?P/Sx:1,I:Sx?Pt/(U1*(P/Sx)):0};});
   const Is=['A','B','C'].map(p=>M.phase[p].I),avg=(Is[0]+Is[1]+Is[2])/3;
   M.Pd=act.reduce((a,x)=>a+x.Pd,0);M.Psum=act.reduce((a,x)=>a+x.Ptt,0);M.Ptt=['A','B','C'].reduce((a,p)=>a+M.phase[p].P,0);
   M.cos=M.Psum/act.reduce((a,x)=>a+x.Ptt/x.cos,0);M.Ib=Math.max(...Is);M.unbal=avg?(Math.max(...Is)-Math.min(...Is))/avg*100:0;
   if(M.unbal>20)M.msgs.push(['w','Lệch pha '+fmt(M.unbal,0)+'% > 20%: bấm "Tự cân pha" hoặc chia lại tủ']);
  }
  M.Ireq=Math.max(M.Ib*st.kMain,maxBrIn);M.In=selCB(M.Ireq);M.maxBrIn=maxBrIn;
  if(!three){const cap=+st.cbMax1P;M.cap=cap;
   M.kdtMax=Math.floor(cap/st.kMain*U1*M.cos/M.Psum*100)/100;
   if(M.In&&M.In>cap){M.over=true;M.msgs.push(['e','CB tổng '+M.In+'A > '+cap+'A (CB điện lực tại công tơ). Giảm k_đt toàn nhà xuống ≤ '+fmt(M.kdtMax)+' hoặc chuyển cấp điện 3 pha']);}
   if(maxBrIn>cap)M.msgs.push(['e','Có CB nhánh '+maxBrIn+'A > '+cap+'A: phải tách tải/giảm CB nhánh']);
   if(M.kdtMax<0.4)M.msgs.push(['w','k_đt toàn nhà cho phép chỉ '+fmt(M.kdtMax)+' – quá thấp so với thực tế: nên rà lại công suất thiết bị hoặc xin cấp 3 pha']);}
  if(!M.In)M.msgs.push(['e','CB tổng vượt bảng tra']);
  else{
   M.cb=(three?'MCCB 4P ':'MCCB/MCB 2P ')+M.In+'A';
   M.cab=three?selCable(M.In,M.Ib,+pr.len||0,M.cos,U3,true,IZ.CVV3,+st.dUmain,+st.minSfeed)
              :selCable(M.In,M.Ib,+pr.len||0,M.cos,U1,false,IZ.CVV2,+st.dUmain,+st.minSfeed);
   if(!M.cab)M.msgs.push(['e','Không có cáp nguồn phù hợp']);
   else{M.S=M.cab.S;M.PE=peOf(M.S);M.wire=(three?'CVV 4×':'CVV 2×')+fmt(M.S)+' + PE CV '+fmt(M.PE);M.conduit=conduitCVV(M.S,three?5:3);M.du=M.cab.du;
    if(M.cab.upDU)M.msgs.push(['i','Tăng tiết diện cáp nguồn do sụt áp']);}
  }
  M.modules=(three?4:2)+act.length*2+(three?4:2);
  M.encl=ENCL.find(x=>x>=Math.ceil(M.modules*1.2))||ENCL.at(-1);
 }
 // ===== sụt áp tích lũy & cảnh báo chọn lọc =====
 for(const rb of R.boards){
  if(M.In&&rb.In&&M.In===rb.In)rb.msgs.push(['i','CB nhánh bằng CB tổng – chọn lọc kém, chấp nhận do giới hạn CB tổng']);
  if(rb.In&&rb.maxIn&&!(rb.In>rb.maxIn))rb.msgs.push(['w','CB nhánh không lớn hơn CB thiết bị lớn nhất']);
  for(const r of rb.loads){
   if(r.du==null)continue;
   r.duTot=(M.du||0)+(rb.du||0)+r.du;
   if(r.duTot>+st.dUtot)r.msgs.push(['e','ΔU tổng '+fmt(r.duTot,2)+'% > '+st.dUtot+'%']);
  }
 }
 return R;
}

function bom(R){
 const w=1+(+ST().waste||0)/100,cb={},cv={},cvv={},con={},encl={};
 const add=(m,k,q,where)=>{if(!m[k])m[k]={q:0,w:new Set()};m[k].q+=q;if(where)m[k].w.add(where);};
 const M=R.main,pr=S.project;
 if(M.In)add(cb,M.cb,1,'Tủ tổng');
 if(M.S){add(cvv,(M.three?'CVV 4×':'CVV 2×')+fmt(M.S),(+pr.len||0)*w);add(cv,M.PE,(+pr.len||0)*w);add(con,M.conduit,(+pr.len||0)*w);}
 if(M.encl)add(encl,'Tủ điện tổng ≥ '+M.encl+' module',1);
 for(const rb of R.boards){
  const nm=rb.b.name;
  if(rb.In)add(cb,rb.cb,2,'Tủ tổng + đầu '+nm);
  if(rb.S){const L=(+rb.b.len||0)*w;add(cvv,'CVV 2×'+fmt(rb.S),L);add(cv,rb.PE,L);add(con,rb.conduit,L);}
  if(rb.Pd>0)add(encl,'Tủ điện nhánh ≥ '+rb.encl+' module',1,nm);
  for(const r of rb.loads){
   if(r.In)add(cb,r.cb,1,nm);
   if(r.S){const L=(+r.ld.len||0)*w;add(cv,r.S,2*L);add(cv,r.PE,L);add(con,r.conduit,L);}
  }
 }
 return {cb,cv,cvv,con,encl};
}

const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msgs(a){return a&&a.length?'<div class="msg">'+a.map(m=>'<div class="'+m[0]+'">'+(m[0]==='e'?'✖ ':m[0]==='w'?'⚠ ':'ℹ ')+esc(m[1])+'</div>').join('')+'</div>':'';}
function status(a){if(!a||!a.length)return '<span class="pill p-ok">OK</span>';if(a.some(m=>m[0]==='e'))return '<span class="pill p-e">Lỗi</span>';if(a.some(m=>m[0]==='w'))return '<span class="pill p-w">Lưu ý</span>';return '<span class="pill p-ok">OK</span>';}

 return h+'</select>';

/* ===================== VẬT TƯ ===================== */
function bomRows(B){
 const out=[],sortK=(a,b)=>parseFloat(a.replace(/[^\d.]/g,''))-parseFloat(b.replace(/[^\d.]/g,''));
 const cbKeys=Object.keys(B.cb).sort((a,b)=>a.split(' ')[0].localeCompare(b.split(' ')[0])||(parseFloat(a.match(/(\d+)A/)[1])-parseFloat(b.match(/(\d+)A/)[1])));
 cbKeys.forEach(k=>out.push(['Aptomat',k,'Cái',B.cb[k].q,[...B.cb[k].w].join(', ')]));
 Object.keys(B.encl).sort().forEach(k=>out.push(['Vỏ tủ điện',k,'Cái',B.encl[k].q,[...B.encl[k].w].join(', ')]));
 Object.keys(B.cvv).sort((a,b)=>{const f=k=>{const m=k.match(/(\d)×([\d,]+)/);return +m[1]*1000+parseFloat(m[2].replace(',','.'));};return f(a)-f(b);}).forEach(k=>out.push(['Cáp',k+' mm²','m',Math.ceil(B.cvv[k].q),'Cáp nguồn / cáp trục']));
 Object.keys(B.cv).sort((a,b)=>a-b).forEach(k=>out.push(['Dây đơn','CV '+fmt(+k)+' mm²','m',Math.ceil(B.cv[k].q),'Pha + trung tính + PE']));
 Object.keys(B.con).sort(sortK).forEach(k=>out.push(['Ống luồn','Ống PVC cứng '+k,'m',Math.ceil(B.con[k].q),'']));
 return out;
}

  case 'resetSet':S.settings={...DEF_SET};break;
  case 'new':if(!confirm('Tạo dự án mới (trống)? Dự án hiện tại sẽ bị thay thế – hãy Lưu .json trước nếu cần.'))return;
   S.project={name:'Dự án mới',supply:'1P',kdt:0.75,len:15,boards:[{id:uid(),name:'Tủ nhánh 1',kdt:0.7,len:15,phase:'A',loads:[{id:uid(),devId:'',qty:1,len:15}]}]};break;
  case 'open':document.getElementById('fileOpen').click();return;
  case 'saveJson':download(JSON.stringify(S,null,1),fname('json'),'application/json');return;
  case 'xls':exportXLS();return;
  case 'print':window.print();return;
 }
 save();renderAll();
});
document.getElementById('fileOpen').addEventListener('change',e=>{
 const f=e.target.files[0];if(!f)return;const rd=new FileReader();
 rd.onload=()=>{try{const o=JSON.parse(rd.result);if(!o.project||!o.library)throw 0;o.settings={...DEF_SET,...o.settings};S=o;save();renderAll();toast('Đã mở '+f.name);}catch(x){alert('File không đúng định dạng dự án.');}};
 rd.readAsText(f,'utf-8');e.target.value='';
});
function fname(ext){return (S.project.name||'du-an').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w-]+/g,'_')+'.'+ext;}
function download(data,name,type){const b=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

/* ===================== XUẤT EXCEL (SpreadsheetML) ===================== */
function exportXLS(){
 const x=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const cell=v=>{if(typeof v==='number'&&isFinite(v))return '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>';
  const n=typeof v==='string'&&/^-?\d{1,3}(\.\d{3})*(,\d+)?$|^-?\d+(,\d+)?$/.test(v)?+v.replace(/\./g,'').replace(',','.'):null;
  return n!==null&&v!==''?'<Cell><Data ss:Type="Number">'+n+'</Data></Cell>':'<Cell><Data ss:Type="String">'+x(v)+'</Data></Cell>';};
 const sheet=(name,hdr,rows)=>'<Worksheet ss:Name="'+x(name)+'"><Table>'+'<Row>'+hdr.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+x(h)+'</Data></Cell>').join('')+'</Row>'+rows.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')+'</Table></Worksheet>';
 const st=ST(),pr=S.project;
 const info=[['Dự án',pr.name],['Nguồn',pr.supply==='3P'?'3 pha 380V':'1 pha 220V'],['k_đt toàn nhà',pr.kdt],['Nhiệt độ (°C)',st.temp],['Hệ số hiệu chỉnh Iz',+kt().toFixed(3)],['ΔU tổng tối đa (%)',st.dUtot],['Ngày xuất',new Date().toLocaleString('vi-VN')]];
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
  '<Styles><Style ss:ID="Default"><Font ss:FontName="Arial" ss:Size="10"/></Style><Style ss:ID="h"><Font ss:FontName="Arial" ss:Bold="1"/><Interior ss:Color="#DDEBF7" ss:Pattern="Solid"/></Style></Styles>'+
  sheet('Thong_tin',['Mục','Giá trị'],info)+sheet('Ket_qua',RES_HDR,resultRows(R))+
  sheet('Vat_tu',['Nhóm','Quy cách','ĐVT','Số lượng','Vị trí'],bomRows(bom(R)))+
  sheet('Thu_vien',['Nhóm','Tên','P (W)','Cosφ','Chống giật','CB tối thiểu (A)','Đặc tính','Ghi chú'],S.library.map(d=>[d.group,d.name,+d.P,+d.cos,d.rcd?'Có':'Không',+d.imin,d.curve,d.note]))+
  '</Workbook>';
 download(xml,fname('xls'),'application/vnd.ms-excel');toast('Đã xuất Excel');
}

renderAll();
</script>
