<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Tính chọn Aptomat & Dây dẫn – Nhà dân dụng</title>
<style>
:root{--bg:#f4f6f9;--card:#fff;--line:#dde3ea;--ink:#1f2933;--mute:#66788a;--acc:#1f5fa8;--acc2:#e8f0fb;--ok:#1e7d32;--warn:#b26a00;--err:#c62828;--inp:#fffdf2;--lt:#f2b705;--sk:#2e7d32;--dr:#c2410c}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
header{background:var(--acc);color:#fff;padding:10px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;position:sticky;top:0;z-index:10}
header h1{font-size:16px;margin:0;flex:1;min-width:240px}
header h1 small{display:block;font-weight:normal;opacity:.8;font-size:11px}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;color:var(--ink);padding:5px 10px;border-radius:5px}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:#fff;border-color:var(--acc)}
button.sm{padding:2px 7px;font-size:12px}
button.del{color:var(--err);border-color:transparent;background:transparent}
button.del:hover{border-color:var(--err)}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.35)}
nav{display:flex;gap:2px;padding:0 16px;background:#fff;border-bottom:1px solid var(--line);position:sticky;top:52px;z-index:9;overflow-x:auto}
nav button{border:none;border-bottom:3px solid transparent;border-radius:0;padding:10px 12px;background:none;white-space:nowrap}
nav button.on{border-bottom-color:var(--acc);color:var(--acc);font-weight:bold}
main{padding:14px 16px;max-width:1600px;margin:0 auto}
section{display:none}section.on{display:block}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;margin-bottom:14px}
.card>.hd{padding:9px 12px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap;background:#fafbfd;border-radius:8px 8px 0 0}
.card>.hd h3{margin:0;font-size:14px}
.card>.bd{padding:10px 12px}
.ckt{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:6px;margin:10px 0;background:#fff}
.ckt.light{border-left-color:var(--lt)}.ckt.socket{border-left-color:var(--sk)}.ckt.direct{border-left-color:var(--dr)}
.ckt>.ch{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding:7px 10px;background:#fbfcfe;border-bottom:1px solid var(--line);border-radius:6px 6px 0 0}
.ckt>.cb{padding:6px 10px}
.tag{font-size:11px;font-weight:bold;padding:2px 8px;border-radius:10px;color:#fff;white-space:nowrap}
.tag.light{background:var(--lt);color:#3a2c00}.tag.socket{background:var(--sk)}.tag.direct{background:var(--dr)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:8px 14px}
label.f{display:flex;flex-direction:column;gap:3px;font-size:12px;color:var(--mute)}
label.i{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--mute)}
input,select{font:inherit;padding:4px 6px;border:1px solid #c9d2dc;border-radius:4px;background:var(--inp);color:var(--ink);min-width:0}
input[type=number]{width:72px}
input.w{width:100%}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:4px 6px;text-align:left;vertical-align:middle}
th{background:#f0f3f7;font-weight:bold;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
.tw{overflow-x:auto}
.pill{display:inline-block;padding:1px 7px;border-radius:10px;font-size:11px;font-weight:bold}
.p-ok{background:#e6f4ea;color:var(--ok)}.p-w{background:#fff3e0;color:var(--warn)}.p-e{background:#fdecea;color:var(--err)}
.msg{font-size:11.5px;line-height:1.35}
.msg .e{color:var(--err)}.msg .w{color:var(--warn)}.msg .i{color:var(--mute)}
.res{font-weight:bold;color:var(--acc)}
.sum{display:flex;flex-wrap:wrap;gap:4px 16px;font-size:12.5px}
.sum b{color:var(--acc)}
.kpi{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.kpi div{background:var(--acc2);border-radius:6px;padding:8px 10px}
.kpi small{display:block;color:var(--mute);font-size:11px}
.kpi b{font-size:15px}
.hint{color:var(--mute);font-size:12px;margin:4px 0 0}
.sld{display:flex;flex-direction:column;align-items:center}
.box{border:2px solid var(--acc);border-radius:8px;background:#fff;padding:8px 12px;text-align:center;min-width:240px}
.box h4{margin:0 0 4px;font-size:13px}
.vline{width:2px;height:22px;background:var(--acc)}
.bus{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;border-top:2px solid var(--acc);width:100%}
.br{display:flex;flex-direction:column;align-items:center;min-width:220px;max-width:290px}
.br .box{border-color:#5b8bc6;min-width:210px}
.br ul{list-style:none;margin:6px 0 0;padding:0;width:100%}
.br li{border:1px solid var(--line);border-left:4px solid var(--acc);border-radius:4px;padding:4px 6px;margin-bottom:4px;background:#fff;font-size:11.5px}
.br li.light{border-left-color:var(--lt)}.br li.socket{border-left-color:var(--sk)}.br li.direct{border-left-color:var(--dr)}
.legend{font-size:11.5px;color:var(--mute);margin-top:10px;text-align:center}
.ph{display:inline-block;width:18px;height:18px;line-height:18px;border-radius:50%;color:#fff;font-size:11px;font-weight:bold;text-align:center}
.phA{background:#c62828}.phB{background:#f9a825}.phC{background:#1565c0}
.doc h3{margin:16px 0 6px}.doc p,.doc li{line-height:1.5}
details summary{cursor:pointer;color:var(--acc);font-size:12px}
textarea{font:inherit;padding:6px;border:1px solid #c9d2dc;border-radius:4px;background:var(--inp)}
.toast{position:fixed;bottom:18px;right:18px;background:#263238;color:#fff;padding:9px 14px;border-radius:6px;opacity:0;transition:.3s;pointer-events:none}
.toast.on{opacity:.95}
@media print{
 header,nav,.noprint,button{display:none!important}
 body{background:#fff;font-size:11px}
 main{padding:0;max-width:none}
 .card,.ckt{break-inside:avoid;border-color:#999}
 input,select{border:none;background:none;padding:0;appearance:none}
 details{display:block}details>*{display:block}
}
</style>
</head>

<header>

 <button data-act="new">Dự án mới</button>

function hasCircuits(o){return o&&o.project&&o.library&&Array.isArray(o.project.boards)&&o.project.boards.every(b=>Array.isArray(b.circuits));}
function migrate(o){ // v2 (khoảng cách từng điểm) → v3 (chiều dài mặt bằng theo mạch)
 o.project.boards.forEach((b,bi)=>b.circuits.forEach((c,ci)=>{
  if(c.Lplan==null){const its=c.items||[];
   if(c.type==='light'){c.Lplan=Math.max(0,...its.map(i=>+i.dSw||0))+its.reduce((a,i)=>a+(+i.dLamp||0),0);c.L3=its.reduce((a,i)=>a+(i.swType==='c2'?+i.dTrav||0:0),0);}
   else if(c.type==='socket'){const ds=its.map(i=>+i.d||0);c.Lplan=c.topo==='radial'?ds.reduce((a,x)=>a+x,0):c.topo==='ring'?2*Math.max(0,...ds):Math.max(0,...ds);}
   else c.Lplan=+(its[0]&&its[0].d)||0;
   c.Lplan=+c.Lplan.toFixed(1);}
  if(c.L3==null)c.L3=0;
  if(!c.pipe)c.pipe=ROUTE_PIPE[c.route]||'PVC';
  if(!c.layer)c.layer='E-T'+(bi+1)+'-'+CODE[c.type]+(ci+1);
 }));
 o.library.forEach(d=>{if(d.price==null)d.price=0;});
 return o;
}

const ST=()=>S.settings;

function dU(L,I,s,cos,U,three){const sin=Math.sqrt(Math.max(0,1-cos*cos));return (three?Math.sqrt(3):2)*L*I*(RHO/s*cos+XL*sin)/U*100;}
function selCable(In,Ib,L,cos,U,three,tbl,dUmax,minS,kz){
 let up=false;
 for(const s of SECTIONS){if(s<minS)continue;const iz=tbl[s]*kt()*(kz||1);if(iz<In)continue;const du=dU(L,Ib,s,cos,U,three);if(du>dUmax){up=true;continue;}return {S:s,iz,du,upDU:up};}
 return null;
}
function conduitCVV(s,cores){const t=[[2.5,'D20'],[6,'D25'],[16,'D32'],[35,'D40'],[50,'D50'],[999,'D63']];let i=t.findIndex(x=>s<=x[0]);if(cores>=4)i=Math.min(i+1,t.length-1);return t[i][1];}
function pickConduit(s,n,mat){
 const od=WIRE_OD[s]||Math.sqrt(s)*2.2,aw=n*Math.PI*od*od/4,f=(+ST().fill||40)/100;
 for(let i=Math.max(CONDUIT_MIN_BY_S(s),PIPE_MIN[mat]||0);i<CONDUITS.length;i++){const di=CONDUITS[i][1];if(aw<=f*Math.PI*di*di/4)return {size:CONDUITS[i][0],fillPct:aw/(Math.PI*di*di/4)*100};}
 const l=CONDUITS.at(-1);return {size:l[0],fillPct:aw/(Math.PI*l[1]*l[1]/4)*100,over:true};
}

function hMount(k){const st=ST(),Hf=+st.Hf;
 if(k==='ceil')return Hf>0?Hf:+st.Hc;
 if(k==='ac'&&Hf>0)return Hf-(+st.acGap||0);
 if(k==='wh'&&Hf>0&&+st.whOnCeil)return Hf;
 const v=st.mount[k];return v==null?1.2:+v;}
function hRoute(r){const st=ST();return r==='san'||r==='ngam'?0:r==='tuong'||r==='noi'?+st.Htruc:r==='tranGia'?(+st.Hf>0?+st.Hf:+st.Hc):+st.Hc;}

function routeOf(c,lib){
 const st=ST(),Ht=hRoute(c.route),vTu=Math.abs(Ht-+st.Htu),v=k=>Math.abs(Ht-hMount(k));
 const segs=[],acc={plates:{},lamps:[],sockets:[],jb:0,dbox:0,powSw:0,lampPts:0,pts:0};let far=0;

 if(!items.length)return {segs,acc,far:0};
 if(c.type==='light'){
  const plates={};items.forEach(it=>{const k=(it.plate||'CT?').trim()||'CT?';(plates[k]=plates[k]||[]).push(it);});
  const pl=Object.keys(plates).map(k=>{const its=plates[k],swm=its[0].swm||'sw';return {k,its,swm,vs:v(swm)};});
  const nPl=pl.length,radial=c.topo==='radial'&&nPl>1;
  let vert=(radial?nPl:1)*vTu,ends=0,lampV=0,nl=0;

  if(!radial&&nPl>1){acc.jb+=nPl;ends+=2*nPl;vert+=nPl*(+st.brOff||0);}

  add('Tuyến 2 sợi (tủ → công tắc → đèn): mặt bằng '+fmt(Lp)+'m + đi đứng',Lp+vert+lampV,[1,1,pe],ends,radial?nPl:1,vert+lampV);
  // công tắc 2 chiều: đoạn 3 sợi
  const c2=items.filter(i=>i.swType==='c2');
  if(c2.length){
   // gom theo bảng: mỗi bảng có hạt 2 chiều → 1 bảng công tắc thứ 2 (cùng số hạt 2 chiều)
   const byPl={};c2.forEach(i=>{const k=(i.plate||'CT?').trim();byPl[k]=(byPl[k]||0)+1;});
   let v3=0;Object.entries(byPl).forEach(([k,n])=>{const swm=plates[k][0].swm||'sw';v3+=2*v(swm);acc.plates[k+' (vị trí 2)']={n,types:Array(n).fill('c2'),fan:Array(n).fill(false),wet:plates[k].some(i=>i.swWet),second:true};acc.pts++;});
   add('Đoạn 3 sợi giữa 2 công tắc 2 chiều: mặt bằng '+fmt(+c.L3||0)+'m + đi đứng',(+c.L3||0)+v3,[3,0,0],2*Object.keys(byPl).length,0,v3);
   if(!(+c.L3>0))acc.warnL3=true;
  }
  far=(Lp+vert+lampV)/2; // tải phân bố đều dọc tuyến → chiều dài tương đương ≈ ½
 }else if(c.type==='socket'){
  const n=items.length;let vert=0,ends=0,panel=1;
  items.forEach(it=>acc.sockets.push({n:Math.max(1,+it.nSock||1),type:it.sockType||'doi',wet:!!it.wet}));
  const vs=items.map(it=>v(it.mount));
  if(c.topo==='radial'){vert=n*vTu+vs.reduce((a,x)=>a+x,0);ends=n;panel=n;far=Lp/n+vTu+Math.max(...vs);}
  else if(c.topo==='ring'){vert=2*vTu+2*vs.reduce((a,x)=>a+x,0);ends=2*n;panel=2;}
  else{vert=vTu+2*vs.reduce((a,x)=>a+x,0)-vs[n-1];ends=2*n-1;} // nối tiếp từ ổ này sang ổ kia
  acc.pts=n;
  add('Tuyến 3 sợi: mặt bằng '+fmt(Lp)+'m + đi đứng',Lp+vert,[1,1,pe],ends,panel,vert);
  if(c.topo==='ring')far=(Lp+vert)/4;else if(c.topo!=='radial')far=(Lp+vert)/2; // tải phân bố: ½ chiều dài (vòng: ¼ do cấp 2 phía)
 }else{
  const it=items[0],d=lib[it.devId],hd=hMount(it.mount||d.mount);let vert,ends;
  if(it.sw){vert=vTu+v('swPow')+Math.abs(hMount('swPow')-hd);ends=3;acc.powSw++;acc.pts=2;add('Tủ → công tắc công suất → thiết bị: mặt bằng '+fmt(Lp)+'m + '+fmt(+st.swGap)+'m + đi đứng',Lp+(+st.swGap||0)+vert,[1,1,pe],ends,1,vert);}
  else{vert=vTu+Math.abs(Ht-hd);ends=1;acc.dbox++;acc.pts=1;add('Tủ → thiết bị: mặt bằng '+fmt(Lp)+'m + đi đứng',Lp+vert,[1,1,pe],ends,1,vert);}
  far=segs[0].L;
 }
 return {segs,acc,far};
}

function calcCircuit(c,lib){
 const st=ST(),U1=+st.U1,r={c,msgs:[]};
 const items=c.items.filter(it=>lib[it.devId]);
 if(c.items.length>items.length)r.msgs.push(['w',(c.items.length-items.length)+' dòng chưa chọn thiết bị']);
 if(!items.length){r.msgs.push(['w','Mạch chưa có thiết bị']);r.P=0;r.route=routeOf(c,lib);return r;}
 let P=0,Sx=0,rcd=false,imin=0;
 items.forEach(it=>{const d=lib[it.devId],q=c.type==='direct'?1:Math.max(0,+it.qty||0),p=d.P*q;P+=p;Sx+=p/(+d.cos||0.9);rcd=rcd||!!d.rcd||!!it.wet||!!it.swWet;imin=Math.max(imin,+d.imin||0);
  if(d.kind!==({light:'light',socket:'plug',direct:'direct'})[c.type])r.msgs.push(['w',d.name+': thư viện xếp loại "'+KIND[d.kind]+'"']);
  if(c.type==='socket'&&d.P>+st.plugMax)r.msgs.push(['e',d.name+' '+d.P+'W > '+st.plugMax+'W: phải đi mạch riêng']);});
 if(c.type==='direct'&&c.items.length>1)r.msgs.push(['w','Mạch riêng chỉ nên có 1 thiết bị']);
 if(!(+c.Lplan>0))r.msgs.push(['w','Chưa nhập chiều dài mặt bằng (m) – đo theo layer '+(c.layer||'')+' trên AutoCAD']);
 r.Pd=P;r.P=c.type==='socket'?P*(+st.ks||1):P;r.cos=P/Sx;r.Ib=r.P/(U1*r.cos);
 const big=c.type==='direct'&&+st.directRule&&P>+st.plugMax;
 const minCB=c.type==='light'?+st.minCBLight:c.type==='socket'?+st.minCBSock:(big?+st.minCBDirect:10);
 r.Ireq=Math.max(r.Ib*st.kDev,minCB,imin);r.In=selCB(r.Ireq);
 r.rcd=c.type==='socket'?(!!+st.sockRCD||rcd):rcd;
 r.type=r.rcd?'RCBO 1P+N':'MCB 1P';
 r.route=routeOf(c,lib);
 if(r.route.acc.warnL3)r.msgs.push(['w','Có công tắc 2 chiều nhưng chưa nhập chiều dài đoạn 3 sợi']);
 if(!r.In){r.msgs.push(['e','Vượt bảng tra CB']);return r;}
 r.cb=r.type+' '+r.In+'A';
 if(c.type==='socket'&&r.In>+st.sockMaxCB)r.msgs.push(['e','Ổ cắm định mức 16A nhưng CB '+r.In+'A: CB không bảo vệ quá tải cho ổ – tách mạch hoặc chuyển thiết bị lớn sang mạch riêng']);
 if(c.type==='direct'&&/lò|bếp|nóng|giặt|rửa/i.test(items[0]&&lib[items[0].devId].name||'')&&!r.rcd)r.msgs.push(['w','Thiết bị khu ẩm ướt / vỏ kim loại – nên dùng RCBO']);
 const ring=c.topo==='ring'&&c.type==='socket';
 let minS=c.type==='light'?+st.minSLight:c.type==='socket'?+st.minSSock:(big?+st.minSDirect:2.5);
 if(+st.vnRule&&r.In>=16)minS=Math.max(minS,2.5);
 r.cab=selCable(r.In,ring?r.Ib/2:r.Ib,r.route.far,r.cos,U1,false,IZ.CV,+st.dUdev,minS,ring?+st.kRing:1);
 if(!r.cab){r.msgs.push(['e','Không có tiết diện phù hợp – tách mạch hoặc rút ngắn tuyến']);return r;}
 r.S=r.cab.S;r.PE=r.S;r.du=r.cab.du;
 if(r.cab.upDU)r.msgs.push(['i','Tăng tiết diện do sụt áp']);
 if(ring)r.msgs.push(['i','Mạch vòng: khả năng tải dây ×'+fmt(st.kRing)+'; sụt áp tính ½ dòng, ¼ chiều dài vòng (tải phân bố)']);
 const wst=1+(+st.waste||0)/100,dp=1+(+st.dpOng||0)/100,mat=c.pipe||'PVC';
 r.wire={L:0,N:0,PE:0};r.pipes={};r.segs=[];
 for(const g of r.route.segs){
  const nw=g.n[0]+g.n[1]+g.n[2],cd=pickConduit(r.S,nw,mat),Lc=g.L*dp;
  const w=[0,1,2].map(i=>(Lc*g.n[i]+g.n[i]*g.ends*(+st.chuaBox)+g.n[i]*g.panel*(+st.chuaTu))*wst);
  r.wire.L+=w[0];r.wire.N+=w[1];r.wire.PE+=w[2];
  r.pipes[cd.size]=(r.pipes[cd.size]||0)+Lc;
  r.segs.push({...g,Lc,size:cd.size,fillPct:cd.fillPct,w});
  if(cd.over)r.msgs.push(['e','Quá nhiều dây cho ống lớn nhất']);
 }
 r.mat=mat;r.elb=Math.ceil((r.route.acc.pts||0)*(+st.elbowPerPt||0))+2;
 return r;
}

function compute(){
 const st=ST(),lib=LIBM(),pr=S.project,U1=+st.U1,U3=+st.U3,three=pr.supply==='3P';
 const R={boards:[]};
 for(const b of pr.boards){
  const rb={b,circuits:[],msgs:[]};let Pd=0,Sd=0,maxP=0,maxIn=0,maxIb=0;
  for(const c of b.circuits){const r=calcCircuit(c,lib);rb.circuits.push(r);if(r.P>0){Pd+=r.P;Sd+=r.P/r.cos;maxP=Math.max(maxP,r.P);maxIb=Math.max(maxIb,r.Ib);if(r.In)maxIn=Math.max(maxIn,r.In);}}
  rb.Pd=Pd;rb.maxIn=maxIn;
  if(b.circuits.length>1&&((+b.kdt)<+st.kdtLo-1e-9||(+b.kdt)>+st.kdtHi+1e-9))rb.msgs.push(['w','k_đt = '+fmt(b.kdt)+' ngoài khoảng '+fmt(st.kdtLo)+'–'+fmt(st.kdtHi)]);
  if(Pd>0){
   rb.cos=Pd/Sd;rb.Ptt=Math.max((+b.kdt||1)*Pd,maxP);rb.Ib=Math.max(rb.Ptt/(U1*rb.cos),maxIb);
   rb.Ireq=Math.max(rb.Ib*st.kBr,nextCB(maxIn)||Infinity);rb.In=selCB(rb.Ireq);
   if(!rb.In)rb.msgs.push(['e','CB nhánh vượt bảng tra']);
   else{rb.cb='MCB 2P '+rb.In+'A';
    rb.cab=selCable(rb.In,rb.Ib,+b.len||0,rb.cos,U1,false,IZ.CVV2,+st.dUbr,+st.minSfeed);
    if(!rb.cab)rb.msgs.push(['e','Không có cáp trục phù hợp']);
    else{rb.S=rb.cab.S;rb.PE=peOf(rb.S);rb.wire='CVV 2×'+fmt(rb.S)+' + E '+fmt(rb.PE);rb.conduit=conduitCVV(rb.S,3);rb.du=rb.cab.du;}}
  }else rb.msgs.push(['w','Tủ chưa có tải']);
  rb.modules=2+rb.circuits.reduce((a,r)=>a+(r.In?(r.rcd?2:1):0),0);
  rb.encl=ENCL.find(x=>x>=rb.modules)||ENCL.at(-1);
  R.boards.push(rb);
 }
 const act=R.boards.filter(x=>x.Ptt>0),M={three,msgs:[]};R.main=M;
 const maxBrIn=Math.max(0,...act.map(x=>x.In||0));
 if(act.length){
  M.Pd=act.reduce((a,x)=>a+x.Pd,0);M.Psum=act.reduce((a,x)=>a+x.Ptt,0);
  if(!three){const Sx=act.reduce((a,x)=>a+x.Ptt/x.cos,0);M.Ptt=(+pr.kdt||1)*M.Psum;M.cos=M.Psum/Sx;M.Ib=M.Ptt/(U1*M.cos);}
  else{M.phase={};['A','B','C'].forEach(p=>{const xs=act.filter(x=>(x.b.phase||'A')===p),P=xs.reduce((a,x)=>a+x.Ptt,0),Sx=xs.reduce((a,x)=>a+x.Ptt/x.cos,0),Pt=(+pr.kdt||1)*P;M.phase[p]={P:Pt,cos:Sx?P/Sx:1,I:Sx?Pt/(U1*(P/Sx)):0};});
   const Is=['A','B','C'].map(p=>M.phase[p].I),avg=(Is[0]+Is[1]+Is[2])/3;
   M.Ptt=['A','B','C'].reduce((a,p)=>a+M.phase[p].P,0);M.cos=M.Psum/act.reduce((a,x)=>a+x.Ptt/x.cos,0);M.Ib=Math.max(...Is);M.unbal=avg?(Math.max(...Is)-Math.min(...Is))/avg*100:0;
   if(M.unbal>20)M.msgs.push(['w','Lệch pha '+fmt(M.unbal,0)+'% > 20%: bấm "Tự cân pha"']);}
  M.Ireq=Math.max(M.Ib*st.kMain,maxBrIn);M.In=selCB(M.Ireq);
  if(!three){const cap=+st.cbMax1P;M.cap=cap;M.kdtMax=Math.floor(cap/st.kMain*U1*M.cos/M.Psum*100)/100;
   if(M.In&&M.In>cap){M.over=true;M.msgs.push(['e','CB tổng '+M.In+'A > '+cap+'A (CB điện lực tại công tơ). Giảm k_đt toàn nhà ≤ '+fmt(M.kdtMax)+' hoặc xin cấp 3 pha']);}
   else if(M.In===cap)M.msgs.push(['i','CB tổng bằng CB điện lực '+cap+'A – khi quá tải chưa chắc CB nào cắt trước']);
   if(maxBrIn>cap)M.msgs.push(['e','Có CB nhánh '+maxBrIn+'A > '+cap+'A']);
   if(M.kdtMax<0.4)M.msgs.push(['w','k_đt toàn nhà cho phép chỉ '+fmt(M.kdtMax)+' – thấp: rà lại công suất hoặc xin cấp 3 pha']);}
  if(!M.In)M.msgs.push(['e','CB tổng vượt bảng tra']);
  else{M.cb=(three?'MCCB 4P ':(M.In>125?'MCCB 2P ':'MCB 2P '))+M.In+'A';
   M.cab=three?selCable(M.In,M.Ib,+pr.len||0,M.cos,U3,true,IZ.CVV3,+st.dUmain,+st.minSfeed):selCable(M.In,M.Ib,+pr.len||0,M.cos,U1,false,IZ.CVV2,+st.dUmain,+st.minSfeed);
   if(!M.cab)M.msgs.push(['e','Không có cáp nguồn phù hợp']);
   else{M.S=M.cab.S;M.PE=peOf(M.S);M.cable=st.mainCable+' '+(three?'4×':'2×')+fmt(M.S);M.wire=M.cable+' + E '+fmt(M.PE);M.conduit=conduitCVV(M.S,three?5:3);if(st.mainPipe==='HDPE'&&CONDUITS.findIndex(x=>x[0]===M.conduit)<2)M.conduit='D25';M.du=M.cab.du;}}
  M.modules=(three?4:2)+act.length*2+(+st.spd?(three?4:2)*2:0);
  M.encl=ENCL.find(x=>x>=M.modules)||ENCL.at(-1);
 }
 for(const rb of R.boards){
  if(M.In&&rb.In&&M.In===rb.In)rb.msgs.push(['i','CB nhánh bằng CB tổng – chọn lọc kém']);
  for(const r of rb.circuits){if(r.du==null)continue;r.duTot=(M.du||0)+(rb.du||0)+r.du;if(r.duTot>+st.dUtot)r.msgs.push(['e','ΔU tổng '+fmt(r.duTot,2)+'% > '+st.dUtot+'%']);}
 }
 return R;
}

/* =========================================================
   BÓC VẬT TƯ – tên vật tư chuẩn hoá để tra đơn giá trong thư viện
   ========================================================= */
const BOM_CAT={A:'A. Thiết bị đóng cắt & bảo vệ',B:'B. Tủ điện & phụ kiện tủ',C:'C. Dây, cáp & đầu cos',D:'D. Ống luồn & phụ kiện ống',E:'E. Công tắc – ổ cắm – đế âm – hộp nối',F:'F. Tiếp địa & chống sét',G:'G. Đèn – quạt (thiết bị)'};
const COLOR={L:'pha L (đỏ/nâu)',N:'trung tính N (xanh dương/đen)',PE:'tiếp địa PE (vàng sọc xanh)'};
const N={
 cb:s=>s,
 wire:(s,col)=>'Dây CV '+fmt(s)+' mm² – '+COLOR[col],
 cvv:(cores,s)=>'Cáp CVV '+cores+'×'+fmt(s)+' mm²',
 cable:(type,cores,s)=>'Cáp '+type+' '+cores+'×'+fmt(s)+' mm²',
 cos:s=>'Đầu cos đồng '+fmt(s)+' mm²',
 pipe:(mat,sz)=>'Ống '+PIPE[mat]+' '+sz,
 sleeve:(mat,sz)=>(mat==='EMT'?'Khớp nối ống thép ':'Măng sông nối ống ')+sz,
 clamp:(mat,sz)=>(mat==='EMT'?'Kẹp ống thép ':'Kẹp đỡ ống ')+sz,
 elbow:(mat,sz)=>(mat==='EMT'?'Co ống thép 90° ':'Cút 90° ')+sz,
 hdpeJoint:sz=>'Khớp nối HDPE '+sz,
 encl:m=>'Vỏ tủ điện âm tường '+m+' module',encl65:m=>'Tủ điện chống nước IP65 '+m+' module',
 plate:(n,wet)=>'Mặt công tắc '+n+' hạt'+(wet?' chống nước':''),
 sock:(t,wet)=>(t==='don'?'Ổ cắm đơn':'Ổ cắm đôi')+' 3 chấu 16A'+(wet?' chống nước':''),
};
const HAT={c1:'Hạt công tắc 1 chiều 10A',c2:'Hạt công tắc 2 chiều 10A',dim:'Hạt chiết áp đèn',dimFan:'Hạt chiết áp quạt'};
function bom(R,only){
 const st=ST(),w=1+(+st.waste||0)/100,items={},lib=LIBM();
 const add=(cat,name,unit,q,where)=>{if(!(q>0))return;const k=cat+'|'+name;if(!items[k])items[k]={cat,name,unit,q:0,w:new Set()};items[k].q+=q;if(where)items[k].w.add(where);};
 const pipeFit=(mat,size,Lc,elb,where)=>{add('D',N.pipe(mat,size),'m',Lc,where);
  if(mat==='PVC'||mat==='EMT'){add('D',N.sleeve(mat,size),'Cái',Math.ceil(Lc/(mat==='EMT'?3.05:(+st.pipeLen||2.92))),where);add('D',N.clamp(mat,size),'Cái',Math.ceil(Lc*(+st.clampPerM||0)),where);add('D',N.elbow(mat,size),'Cái',elb,where);}
  else if(mat==='RG')add('D',N.clamp('PVC',size),'Cái',Math.ceil(Lc*(+st.clampPerM||0)),where);
  else if(mat==='HDPE')add('D',N.hdpeJoint(size),'Cái',2,where);};
 const cos=(s,n,where)=>{if(s>=+st.cosMinS)add('C',N.cos(s),'Cái',n,where);};
 const encl=(mod,where,ip65)=>{add('B',ip65?N.encl65(mod):N.encl(mod),'Cái',1,where);add('B','Thanh cái / cầu đấu trung tính N','Bộ',1,where);add('B','Thanh cái / cầu đấu tiếp địa PE','Bộ',1,where);add('B','Nhãn lộ, máng đi dây trong tủ','Bộ',1,where);};
 const M=R.main,pr=S.project,three=pr.supply==='3P',dp=1+(+st.dpOng||0)/100;
 if(!only){
  const nm='Tủ tổng';
  if(M.In)add('A',M.cb,'Cái',1,nm);
  if(M.S){const L=+pr.len||0;add('C',N.cable(st.mainCable,three?4:2,M.S),'m',L*w,'Cáp nguồn');add('C',N.wire(M.PE,'PE'),'m',L*w,'Cáp nguồn');pipeFit(st.mainPipe||'PVC',M.conduit,L*dp,2,'Cáp nguồn');cos(M.S,(three?4:2)*2,nm);cos(M.PE,2,nm);}
  if(M.encl)encl(M.encl,nm);
  if(+st.spd){add('F',three?'Chống sét lan truyền SPD 4P (Type 2)':'Chống sét lan truyền SPD 2P (Type 2)','Cái',1,nm);add('A',(three?'MCB 4P':'MCB 2P')+' 32A','Cái',1,nm+' (bảo vệ SPD)');}
  if(+st.earth){add('F','Cọc tiếp địa thép mạ đồng D16 L=2,4m','Cọc',+st.rods,'Hệ tiếp địa');add('F','Cáp đồng trần C'+st.bareS,'m',+st.bareLen,'Hệ tiếp địa');
   add('F','Mối hàn hóa nhiệt','Mối',+st.rods,'Hệ tiếp địa');add('F','Hộp kiểm tra tiếp địa','Cái',1,'Hệ tiếp địa');add('C',N.wire(+st.bareS,'PE'),'m',(+st.earthLen||0)*w,'Hệ tiếp địa');}
 }
 for(const rb of R.boards){
  const b=rb.b,nm=b.name;if(only&&only!==b.id)continue;
  if(rb.In)add('A',rb.cb,'Cái',only?1:2,only?nm:'Tủ tổng + đầu '+nm);
  if(rb.S){const L=+b.len||0;add('C',N.cvv(2,rb.S),'m',L*w,nm);add('C',N.wire(rb.PE,'PE'),'m',L*w,nm);pipeFit('PVC',rb.conduit,L*dp,2,nm);cos(rb.S,4,nm);cos(rb.PE,2,nm);}
  if(rb.Pd>0)encl(rb.encl,nm,/IP65|mái|ngoài trời/i.test(nm));
  for(const r of rb.circuits){
   const c=r.c,cn=nm+' / '+c.name;
   if(r.In)add('A',r.cb,'Cái',1,nm);
   if(r.S){['L','N','PE'].forEach(k=>add('C',N.wire(r.S,k),'m',r.wire[k],cn));
    for(const sz in r.pipes)pipeFit(r.mat,sz,r.pipes[sz],Object.keys(r.pipes).length?Math.ceil(r.elb*r.pipes[sz]/Object.values(r.pipes).reduce((a,x)=>a+x,0)):0,cn);
    cos(r.S,(c.topo==='ring'?2:1)*(c.type==='light'&&!+st.lightPE?2:3),nm);}
   const A=r.route?r.route.acc:null;if(!A)continue;
   if(A.jb)add('E','Hộp nối dây (hộp chia ngã)','Cái',A.jb,cn);
   for(const k in A.plates){const p=A.plates[k];let n=p.n;
    while(n>0){const g=Math.min(4,n);add('E',N.plate(g,p.wet),'Cái',1,cn);add('E','Đế âm tường','Cái',1,cn);n-=g;}
    p.types.forEach((t,i)=>add('E',t==='dim'?(p.fan[i]?HAT.dimFan:HAT.dim):HAT[t],'Cái',1,cn));}
   A.sockets.forEach(s=>{add('E',N.sock(s.type,s.wet),'Cái',s.n,cn);add('E','Đế âm tường','Cái',s.n,cn);});

   if(A.dbox)add('E','Hộp đấu nối thiết bị (ổ cắm công suất / domino)','Cái',A.dbox,cn);

  }
 }
 return Object.values(items).sort((a,b)=>a.cat.localeCompare(b.cat)||a.name.localeCompare(b.name,'vi',{numeric:true}));
}

function fmt(x,d){if(x==null||isNaN(x))return '';if(d==null)return String(+(+x).toFixed(2)).replace('.',',');return (+x).toLocaleString('vi-VN',{minimumFractionDigits:d,maximumFractionDigits:d});}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function msgs(a){return a&&a.length?'<div class="msg">'+a.map(m=>'<div class="'+m[0]+'">'+(m[0]==='e'?'✖ ':m[0]==='w'?'⚠ ':'ℹ ')+esc(m[1])+'</div>').join('')+'</div>':'';}
function status(a){if(!a||!a.length)return '<span class="pill p-ok">OK</span>';if(a.some(m=>m[0]==='e'))return '<span class="pill p-e">Lỗi</span>';if(a.some(m=>m[0]==='w'))return '<span class="pill p-w">Lưu ý</span>';return '<span class="pill p-ok">OK</span>';}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>e.classList.remove('on'),2200);}
const A=(o)=>Object.entries(o).map(([k,v])=>'data-'+k+'="'+esc(v)+'"').join(' ');
function inp(k,val,attrs,w){return '<input data-k="'+k+'" '+attrs+' type="text" value="'+esc(val)+'"'+(w?' style="width:'+w+'px"':'')+'>';}
function num(k,val,attrs,step,w){return '<input data-k="'+k+'" '+attrs+' type="number" step="'+(step||'any')+'" min="0" value="'+esc(val)+'"'+(w?' style="width:'+w+'px"':'')+'>';}
function sel(k,cur,opts,attrs,w){return '<select data-k="'+k+'" '+attrs+(w?' style="max-width:'+w+'px"':'')+'>'+Object.entries(opts).map(([v,l])=>'<option value="'+esc(v)+'"'+(String(v)===String(cur)?' selected':'')+'>'+esc(l)+'</option>').join('')+'</select>';}
function chk(k,on,attrs){return '<input data-k="'+k+'" '+attrs+' type="checkbox"'+(on?' checked':'')+'>';}
function devSelect(k,cur,attrs,kind){
 const g={};S.library.filter(d=>!kind||d.kind===kind||d.id===cur).forEach(d=>{(g[d.group||'Khác']=g[d.group||'Khác']||[]).push(d);});
 let h='<select data-k="'+k+'" '+attrs+' style="max-width:260px"><option value="">— chọn —</option>';
 for(const n in g)h+='<optgroup label="'+esc(n)+'">'+g[n].map(d=>'<option value="'+d.id+'"'+(d.id===cur?' selected':'')+'>'+esc(d.name)+(d.kind==='light'||/\d+W/.test(d.name)?'':' ('+d.P+'W)')+'</option>').join('')+'</optgroup>';
 return h+'</select>';
}
const mountOpts=g=>{const o={};mountsOf(g).forEach(m=>o[m[0]]=m[1]+' ('+fmt(hMount(m[0]))+'m)');return o;};
const phBadge=p=>'<span class="ph ph'+p+'">'+p+'</span>';
const priceOf=name=>{const d=S.library.find(x=>x.name===name);if(d&&+d.price>0)return +d.price;return +((S.prices||{})[name]||0);};

let bomFilter='';
function bomTable(items){
 const st=ST(),roll=+st.roll||100;let rows=[],sum=0,i=0,cat='',miss=0;
 for(const it of items){
  if(it.cat!==cat){cat=it.cat;rows.push({h:BOM_CAT[cat]});}
  const q=it.unit==='m'?Math.ceil(it.q):Math.ceil(it.q-1e-9),pr=priceOf(it.name),tt=q*pr;sum+=tt;if(!pr)miss++;
  rows.push({i:++i,cat:BOM_CAT[cat],name:it.name,unit:it.unit,q,pr,tt,note:/^Dây CV/.test(it.name)?'≈ '+Math.ceil(q/roll-1e-9)+' cuộn '+roll+'m':'',w:[...it.w].join(', ')});
 }
 const aux=sum*(+st.auxPct||0)/100;
 return {rows,sum,aux,total:sum+aux,miss};
}

function parseCad(txt,unit){
 const lines=txt.split(/\r?\n/).map(l=>l.trim()).filter(Boolean),res={};if(!lines.length)return res;
 const split=l=>l.split(/\t|;|,(?=\s*[^\d\s])|,\s*(?=[\d.]+\s*$)|,/).map(x=>x.trim().replace(/^"|"$/g,''));
 let hdr=split(lines[0]).map(x=>x.toLowerCase()),iL=hdr.findIndex(x=>x==='layer'),iLen=hdr.findIndex(x=>/^length|chiều dài/.test(x)),iCnt=hdr.findIndex(x=>x==='count'||x==='số lượng');
 const hasHdr=iL>=0&&iLen>=0,k=unit==='mm'?0.001:1;
 lines.slice(hasHdr?1:0).forEach(l=>{const p=split(l);let layer,len,cnt=1;
  if(hasHdr){layer=p[iL];len=parseFloat(String(p[iLen]).replace(/\s/g,'').replace(/,(?=\d{3}\b)/g,''));if(iCnt>=0)cnt=parseFloat(p[iCnt])||1;}
  else{layer=p[0];const nums=p.slice(1).map(x=>parseFloat(String(x).replace(/\s/g,''))).filter(x=>!isNaN(x));len=nums.at(-1);}
  if(layer&&!isNaN(len))res[layer.toUpperCase()]=(res[layer.toUpperCase()]||0)+len*cnt*k;});
 return res;
}

   const name=p[0],price=parseFloat(String(p[p.length-1]).replace(/[.\s]/g,'').replace(',','.'));if(!name||isNaN(price)||price<=0)return;
   const d=S.library.find(x=>x.name===name);if(d)d.price=price;else S.prices[name]=price;n++;});
  save();renderAll();toast('Đã nhập '+n+' đơn giá');};
 rd.readAsText(f,'utf-8');e.target.value='';
});
function fname(ext){return (S.project.name||'du-an').normalize('NFD').replace(/[̀-ͯ]/g,'').replace(/đ/g,'d').replace(/Đ/g,'D').replace(/[^\w-]+/g,'_')+'.'+ext;}
function download(data,name,type){const b=new Blob([data],{type});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove();},500);}

function exportXLS(){
 const x=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
 const cell=v=>{if(typeof v==='number'&&isFinite(v))return '<Cell><Data ss:Type="Number">'+v+'</Data></Cell>';
  const n=typeof v==='string'&&v!==''&&/^-?\d{1,3}(\.\d{3})*(,\d+)?$|^-?\d+(,\d+)?$/.test(v)?+v.replace(/\./g,'').replace(',','.'):null;
  return n!==null?'<Cell><Data ss:Type="Number">'+n+'</Data></Cell>':'<Cell><Data ss:Type="String">'+x(v)+'</Data></Cell>';};
 const sheet=(name,hdr,rows)=>'<Worksheet ss:Name="'+x(name)+'"><Table><Row>'+hdr.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+x(h)+'</Data></Cell>').join('')+'</Row>'+rows.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')+'</Table></Worksheet>';
 const st=ST(),pr=S.project,T=bomTable(bom(R,''));
 const info=[['Dự án',pr.name],['Nguồn',pr.supply==='3P'?'3 pha 380V':'1 pha 220V'],['k_đt toàn nhà',pr.kdt],['Nhiệt độ (°C)',st.temp],['Trần BT (m)',st.Hc],['Trần giả (m)',st.Hf],['Ống gen trên tường (m)',st.Htruc],['Tủ điện (m)',st.Htu],['Dự phòng ống (%)',st.dpOng],['Hao hụt dây (%)',st.waste],['Ngày xuất',new Date().toLocaleString('vi-VN')]];
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet">'+
  '<Styles><Style ss:ID="Default"><Font ss:FontName="Arial" ss:Size="10"/></Style><Style ss:ID="h"><Font ss:FontName="Arial" ss:Bold="1"/><Interior ss:Color="#DDEBF7" ss:Pattern="Solid"/></Style></Styles>'+
  sheet('Thong_tin',['Mục','Giá trị'],info)+sheet('Ket_qua',RES_HDR,resultRows(R))+sheet('Khoi_luong_day_ong',QTY_HDR,qtyRows(R))+
  sheet('Boc_vat_tu',['STT','Nhóm','Tên vật tư / quy cách','ĐVT','Khối lượng','Quy đổi','Đơn giá (đ)','Thành tiền (đ)','Vị trí'],T.rows.filter(r=>!r.h).map(r=>[r.i,r.cat,r.name,r.unit,r.q,r.note,r.pr||'',r.tt||'',r.w]).concat([['','','Cộng vật tư chính','','','','',T.sum,''],['','','Vật tư phụ '+st.auxPct+'%','','','','',Math.round(T.aux),''],['','','TỔNG CỘNG (chưa VAT)','','','','',Math.round(T.total),'']]))+
  sheet('Cao_do',['Vị trí lắp','Cao độ (m)'],MOUNTS.map(m=>[m[1],hMount(m[0])]))+
  sheet('Thu_vien',['Nhóm','Tên','P (W)','Cosφ','Kiểu cấp nguồn','Vị trí lắp','Chống giật','CB tối thiểu (A)','Đơn giá (đ)','Ghi chú'],S.library.map(d=>[d.group,d.name,+d.P,+d.cos,KIND[d.kind],MOUNT_LBL[d.mount]||d.mount,d.rcd?'Có':'Không',+d.imin,+d.price||'',d.note]))+
  '</Workbook>';
 download(xml,fname('xls'),'application/vnd.ms-excel');toast('Đã xuất Excel');
}
