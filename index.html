<!DOCTYPE html>
<html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thiết kế điện nhà dân dụng – chọn CB, dây, bóc khối lượng</title>
<style>:root{--bg:#f3f5f8;--card:#fff;--line:#e1e6ed;--ink:#1d2733;--mute:#6b7a8c;--acc:#1f5fa8;--acc2:#e9f1fc;--ok:#1e7d32;--warn:#c27a00;--err:#c62828;--lt:#f2b705;--sk:#2e8b57;--dr:#d2691e;--inp:#fff8dc;--auto:#e8f3ff}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;color:var(--ink);background:var(--bg)}
button{font:inherit;cursor:pointer;border:1px solid var(--line);background:#fff;border-radius:6px;padding:5px 10px;color:var(--ink)}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);border-color:var(--acc);color:#fff}
button.ghost{border-color:transparent;background:transparent}
button.sm{padding:2px 8px;font-size:12px}
button.danger{color:var(--err)}
input,select,textarea{font:inherit;padding:4px 6px;border:1px solid #cfd7e2;border-radius:5px;background:var(--inp);color:var(--ink)}
input[type=number]{width:72px}
input.auto{background:var(--auto)}
input.plain{background:transparent;border-color:transparent;font-weight:bold;padding:2px 4px}
input.plain:hover,input.plain:focus{border-color:#cfd7e2;background:#fff}
header{background:#163f73;color:#fff;display:flex;align-items:center;gap:14px;padding:8px 16px;position:sticky;top:0;z-index:20;flex-wrap:wrap}
header .logo{font-weight:bold;font-size:15px;white-space:nowrap}
.steps{display:flex;gap:4px;flex:1;justify-content:center;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:6px;padding:7px 14px;border-radius:20px;color:#c9d8ee;cursor:pointer;white-space:nowrap}
.step b{display:inline-flex;width:22px;height:22px;border-radius:50%;align-items:center;justify-content:center;background:rgba(255,255,255,.15);font-size:12px}
.step.on{background:#fff;color:#163f73;font-weight:bold}.step.on b{background:#163f73;color:#fff}
.step.done b{background:#3fa66a;color:#fff}
.mode{display:flex;background:rgba(255,255,255,.12);border-radius:16px;padding:2px}
.mode span{padding:4px 10px;border-radius:14px;cursor:pointer;font-size:12px}.mode span.on{background:#fff;color:#163f73;font-weight:bold}
header button{background:rgba(255,255,255,.12);color:#fff;border-color:rgba(255,255,255,.3)}
.filebtns{display:flex;gap:6px}
.summary{background:#fff;border-bottom:1px solid var(--line);padding:7px 16px;display:flex;gap:18px;align-items:center;flex-wrap:wrap;position:sticky;top:46px;z-index:19}
.summary .it{display:flex;flex-direction:column;line-height:1.2}
.summary small{color:var(--mute);font-size:11px}
.summary b{font-size:14px}
.pill{display:inline-flex;align-items:center;gap:4px;padding:3px 10px;border-radius:12px;font-size:12px;font-weight:bold;cursor:pointer;white-space:nowrap}
.p-ok{background:#e6f4ea;color:var(--ok)}.p-w{background:#fff3df;color:var(--warn)}.p-e{background:#fdecea;color:var(--err)}
main{padding:14px 16px;max-width:1520px;margin:0 auto}
.view{display:none}.view.on{display:block}
.split{display:grid;grid-template-columns:300px minmax(0,1fr);gap:14px;align-items:start}
@media(max-width:900px){.split{grid-template-columns:1fr}.tree{position:static!important;max-height:none!important}}
.tree{background:#fff;border:1px solid var(--line);border-radius:10px;padding:8px;position:sticky;top:110px;max-height:calc(100vh - 130px);overflow:auto}
.tree .node{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:6px;cursor:pointer}
.tree .node:hover{background:#f3f7fd}
.tree .node.sel{background:var(--acc2);outline:1px solid #bcd3f2}
.tree .node .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tree .node .cb{font-size:11px;color:var(--acc);font-weight:bold;white-space:nowrap}
.tree .kids{margin-left:16px;border-left:1px dashed #d4dbe5;padding-left:4px}
.dot{width:9px;height:9px;border-radius:50%;flex:none}.d-ok{background:#3fa66a}.d-w{background:#f0a500}.d-e{background:#e53935}
.ico{width:20px;text-align:center;flex:none}
.panel{background:#fff;border:1px solid var(--line);border-radius:10px}
.phead{padding:12px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.phead h2{margin:0;font-size:17px}
.kv{display:flex;gap:14px;flex-wrap:wrap;color:var(--mute);font-size:12px;align-items:center}.kv b{color:var(--ink);font-size:13px}
.pbody{padding:12px 16px}
.res{color:var(--acc);font-weight:bold}
.cc{border:1px solid var(--line);border-left:5px solid var(--acc);border-radius:8px;margin-bottom:10px;background:#fff}
.cc.light{border-left-color:var(--lt)}.cc.socket{border-left-color:var(--sk)}.cc.direct{border-left-color:var(--dr)}
.cc.flash{box-shadow:0 0 0 3px #ffd54f}
.cc .top{display:flex;align-items:center;gap:10px;padding:9px 12px;cursor:pointer;flex-wrap:wrap}
.cc .top .nm{font-weight:bold;flex:1;min-width:140px}
.cc .top .meta{color:var(--mute);font-size:12px}
.cc .body{padding:4px 12px 12px;display:none}
.cc.open .body{display:block}
.chev{transition:.2s;color:var(--mute)}.cc.open .chev{transform:rotate(90deg)}
.ctools{display:flex;gap:6px;align-items:center;margin-bottom:8px;flex-wrap:wrap}
.plates{display:flex;flex-wrap:wrap;gap:14px}
.plate{border:1px solid #d6dde7;border-radius:10px;padding:8px;background:#fafbfd;min-width:170px}
.plate .ph{display:flex;align-items:center;gap:4px;margin-bottom:6px;font-weight:bold;font-size:12px}
.plate .face{display:flex;gap:6px;background:#fff;border:2px solid #c3ccd8;border-radius:8px;padding:6px}
.plate.wet .face{border-color:#4aa3df;background:#f2f9ff}
.hat{width:66px;min-height:78px;border:1px solid #cfd7e2;border-radius:6px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;cursor:pointer;font-size:11px;text-align:center;padding:3px;background:#fff}
.hat:hover{border-color:var(--acc);box-shadow:0 0 0 2px #dbe8fa}
.hat .t{font-size:9.5px;color:#fff;border-radius:3px;padding:0 4px}
.t-c1{background:#7a8899}.t-c2{background:#6a4fb3}.t-dim{background:#c9822b}
.hat .q{font-weight:bold}
.hat.add{color:var(--mute);border-style:dashed;font-size:20px}
.plate .loc{font-size:11px;color:var(--mute);margin-top:5px;display:flex;gap:4px;align-items:center}
.plate .loc input{font-size:11px;padding:1px 4px;width:130px}
.socks{display:flex;flex-wrap:wrap;gap:10px}
.sock{border:1px solid #cfd7e2;border-radius:10px;padding:8px 10px;background:#fff;cursor:pointer;min-width:150px}
.sock:hover{border-color:var(--sk);box-shadow:0 0 0 2px #dff1e6}
.sock .ty{display:flex;align-items:center;gap:6px;font-weight:bold;font-size:12px}
.sock .ty span.g{display:inline-flex;gap:3px}
.sock .ty span.g i{display:inline-block;width:13px;height:13px;border-radius:50%;border:2px solid #555}
.sock.wet{background:#f2f9ff;border-color:#9cc9ea}
.sock .dv{margin-top:4px;font-size:12px}.sock .w{font-size:11px;color:var(--mute)}
.sock.add{display:flex;align-items:center;justify-content:center;color:var(--mute);border-style:dashed;font-size:20px;min-height:58px}
.adv{display:none;margin-top:10px;padding-top:8px;border-top:1px dashed var(--line);gap:12px;flex-wrap:wrap;font-size:12px;color:var(--mute)}
body.advanced .adv{display:flex}
body:not(.advanced) .advOnly{display:none!important}
.adv label{display:flex;flex-direction:column;gap:3px}
.addbar{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.tpl{position:relative}
.menu{position:absolute;top:110%;left:0;background:#fff;border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.12);padding:6px;display:none;z-index:30;min-width:250px}
.menu.on{display:block}
.menu div{padding:7px 10px;border-radius:6px;cursor:pointer}.menu div:hover{background:var(--acc2)}
.menu small{color:var(--mute);display:block}
.pop{position:fixed;background:#fff;border:1px solid var(--line);border-radius:10px;box-shadow:0 12px 32px rgba(0,0,0,.18);padding:12px;z-index:50;width:340px;display:none;max-height:80vh;overflow:auto}
.pop.on{display:block}
.pop h4{margin:0 0 8px;font-size:13px}
.pop .lbl{font-size:12px;color:var(--mute);margin:6px 0}
.opts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:6px}
.opt{border:1px solid var(--line);border-radius:7px;padding:6px 4px;text-align:center;cursor:pointer;font-size:11px}
.opt.on{border-color:var(--acc);background:var(--acc2);font-weight:bold}
.opt .e{font-size:18px;display:block}
.row{display:flex;gap:8px;align-items:center;margin:6px 0;flex-wrap:wrap}
.drawer{position:fixed;right:0;top:0;bottom:0;width:400px;max-width:95vw;background:#fff;box-shadow:-8px 0 24px rgba(0,0,0,.15);z-index:60;transform:translateX(110%);transition:.25s;display:flex;flex-direction:column}
.drawer.on{transform:none}
.drawer .dh{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;align-items:center}
.drawer .dh h3{margin:0;flex:1;font-size:15px}
.drawer .db{padding:10px 16px;overflow:auto}
.issue{border:1px solid var(--line);border-left:4px solid var(--warn);border-radius:7px;padding:8px 10px;margin-bottom:8px}
.issue.e{border-left-color:var(--err)}.issue.i{border-left-color:#8aa0b8}
.issue .w{font-size:11px;color:var(--mute)}
.card{background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:14px}
.card .hd{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.card .hd h3{margin:0;font-size:14px;flex:1}
.card .bd{padding:12px 14px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px 16px}
.grid label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--mute)}
table{border-collapse:collapse;width:100%}
th,td{border:1px solid var(--line);padding:5px 8px;text-align:left;vertical-align:middle}
th{background:#f3f6fa;font-size:12px}
td.n,th.n{text-align:right;white-space:nowrap}
td.c,th.c{text-align:center}
td.out{background:#eef7ee;font-weight:bold;text-align:right;white-space:nowrap}
tr.grp td{background:#eef3fa;font-weight:bold}
.tw{overflow-x:auto}
.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:10px}
.preset{border:2px solid var(--line);border-radius:10px;padding:12px;cursor:pointer;background:#fff}
.preset.on{border-color:var(--acc);background:var(--acc2)}
.preset b{display:block;margin-bottom:4px}
.preset small{color:var(--mute)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.seg span{padding:5px 12px;cursor:pointer;background:#fff;font-size:12px;white-space:nowrap}.seg span.on{background:var(--acc);color:#fff}
.areas{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.areas span{padding:6px 12px;border-radius:16px;border:1px solid var(--line);background:#fff;cursor:pointer}
.areas span.on{background:#163f73;color:#fff;border-color:#163f73}
.note{background:#fffbe9;border:1px solid #f1e2a8;border-radius:8px;padding:8px 12px;font-size:12px;color:#6b5a1d;margin-bottom:12px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--mute);flex-wrap:wrap}
.legend i{display:inline-block;width:12px;height:12px;border-radius:3px;vertical-align:-2px;margin-right:4px}
.two{display:grid;grid-template-columns:repeat(auto-fit,minmax(420px,1fr));gap:14px}
.modal{position:fixed;inset:0;background:rgba(20,30,45,.45);display:none;align-items:center;justify-content:center;z-index:70}
.modal.on{display:flex}
.modal .box{background:#fff;border-radius:12px;width:min(1200px,96vw);max-height:90vh;display:flex;flex-direction:column}
.mtabs{display:flex;gap:4px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.mtabs span{padding:6px 12px;border-radius:6px;cursor:pointer}.mtabs span.on{background:var(--acc2);color:var(--acc);font-weight:bold}
#mbody{padding:14px;overflow:auto}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:#263238;color:#fff;padding:9px 16px;border-radius:8px;opacity:0;transition:.3s;z-index:90;pointer-events:none}
.toast.on{opacity:.95}
.hint{color:var(--mute);font-size:12px}
.doc h3{margin:14px 0 6px}.doc li,.doc p{line-height:1.5}
.sld{display:flex;gap:12px;flex-wrap:wrap}
.sld .bx{border:1px solid var(--line);border-radius:8px;padding:8px;min-width:240px;flex:1;font-size:12px}
.sld .bx h4{margin:0 0 6px}
@media print{header,.summary,.noprint,button,.tree{display:none!important}.split{display:block}body{background:#fff}.view{display:block!important}.card,.panel{break-inside:avoid}}

.presets{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}.preset{border:1px solid var(--line);border-radius:8px;padding:10px;cursor:pointer;background:#fff}.preset.on{border-color:var(--pri);box-shadow:0 0 0 2px #d6e4ff}.preset small{display:block;color:var(--mute);margin-top:4px}
.cc.flash{box-shadow:0 0 0 3px #ffd666}
</style></head><body>

function calcCircuit(c,lib){
 const st=ST(),r={c,iss:[],P:0};let cosS=0,rcd=false,imin=0;
 const use=(d,q)=>{if(!d)return;const p=d.P*q;r.P+=p;cosS+=p/(+d.cos||0.9);rcd=rcd||d.rcd;imin=Math.max(imin,+d.imin||0);};
 if(c.type==='light')c.plates.forEach(p=>{if(p.wet)rcd=true;p.hats.forEach(h=>use(lib[h.dev],Math.max(0,+h.q||0)));});
 else if(c.type==='socket'){c.socks.forEach(s=>{const d=lib[s.dev];use(d,1);if(s.wet)rcd=true;if(d&&d.P>+st.plugMax)r.iss.push(['e',d.name+' '+d.P+'W > '+st.plugMax+'W – phải đi mạch riêng']);});if(+st.sockRCD)rcd=true;}
 else use(lib[c.dev],1);
 if(!(r.P>0)){r.iss.push(['w','Mạch chưa có thiết bị']);return r;}
 r.cos=r.P/cosS;r.Ib=r.P/(+st.U1*r.cos);
 const big=c.type==='direct'&&+st.directRule&&r.P>+st.plugMax;
 const minCB=c.type==='light'?+st.minCBLight:c.type==='socket'?+st.minCBSock:(big?+st.minCBDirect:10);
 r.In=+c.inMan||selCB(Math.max(r.Ib*st.kDev,minCB,imin));
 if(!r.In){r.iss.push(['e','Vượt bảng tra CB']);return r;}
 r.rcd=rcd;r.cb=cbName('MCB 1P',r.In,rcd,st.kaSub);
 if(c.type==='socket'&&r.In>+st.sockMaxCB)r.iss.push(['e','Ổ cắm 16A nhưng CB '+r.In+'A – không bảo vệ được ổ; tách mạch hoặc chuyển thiết bị lớn sang mạch riêng']);
 if(c.type==='direct'&&!rcd&&/bếp|lò|bình|giặt|bơm/i.test((lib[c.dev]||{}).name||''))r.iss.push(['w','Thiết bị khu ẩm ướt / vỏ kim loại – nên dùng RCBO']);
 let minS=c.type==='light'?1.5:c.type==='socket'?2.5:(big?+st.minSDirect:2.5);if(+st.vnRule&&r.In>=16)minS=Math.max(minS,2.5);
 r.cab=selCable(r.In,r.Ib,+c.Lest||+st.Lest,r.cos,IZ.CV,+st.dUdev,minS);
 if(!r.cab){r.iss.push(['e','Không có tiết diện dây phù hợp']);return r;}
 r.S=r.cab.S;r.du=r.cab.du;if(r.cab.up)r.iss.push(['i','Tăng tiết diện do sụt áp']);
 return r;

  '<li><b>Bảng tính video – chiếu sáng</b>: L1 = (2·n1 − 1)(H − Cct); L2 = n1(H − Cct); L3 = 2·n2·Ktg; dây = [(L2 + L3 + x) × 2 + L1] × 1,1; ống nổi = (x + n2·Ktg) × 1,2; ống ngầm = n1(H − Cct) × 1,2; ruột gà = 2·n2·Ktg.</li>'+
  '<li><b>Ổ cắm</b>: (mặt bằng y + đi đứng theo 3 trường hợp) × Kd cho mỗi dây L/N/PE; ống × Ko.</li><li><b>Cáp trục</b>: mặt bằng + tầng chênh × chiều cao tầng + 2 × (trần − cao tủ), làm tròn lên.</li></ul><p class="hint">Kết quả phục vụ thiết kế sơ bộ, cần kỹ sư kiểm tra lại. Tham chiếu TCVN 9206:2012, TCVN 9207:2012, TCVN 7447 (IEC 60364).</p></div>';
}

 const sheet=(n,hd,rows)=>'<Worksheet ss:Name="'+x(n)+'"><Table><Row>'+hd.map(h=>'<Cell ss:StyleID="h"><Data ss:Type="String">'+x(h)+'</Data></Cell>').join('')+'</Row>'+rows.map(r=>'<Row>'+r.map(cell).join('')+'</Row>').join('')+'</Table></Worksheet>';

 const qty=[];areaList().forEach(a=>{const Q=qtyArea(a);qty.push([a.name,'Chiếu sáng ('+(pr.qty.methodL==='video'?'bảng tính video':'VNK')+')',Q.L.x,Q.L.res.L,Q.L.res.N,Q.L.res.PE,Q.L.res.rigid,Q.L.res.flex]);qty.push([a.name,'Ổ cắm (VNK)',Q.S.y,Q.S.res.each,Q.S.res.each,Q.S.res.each,Q.S.res.rigid,0]);Q.D.forEach(d=>qty.push([a.name,'Mạch riêng: '+d.c.name,d.plan,d.wire,d.wire,d.wire,d.pipe,0]));});
 const xml='<?xml version="1.0" encoding="UTF-8"?><?mso-application progid="Excel.Sheet"?><Workbook xmlns="urn:schemas-microsoft-com:office:spreadsheet" xmlns:ss="urn:schemas-microsoft-com:office:spreadsheet"><Styles><Style ss:ID="Default"><Font ss:FontName="Arial" ss:Size="10"/></Style><Style ss:ID="h"><Font ss:FontName="Arial" ss:Bold="1"/><Interior ss:Color="#DDEBF7" ss:Pattern="Solid"/></Style></Styles>'+
  sheet('Thong_tin',['Mục','Giá trị'],[['Công trình',pr.name],['k_đt toàn nhà',pr.kdt],['Ptt (kW)',(M.Ptt||0)/1000],['Itt (A)',M.Ib||0],['CB tổng',M.name||''],['Ngày xuất',new Date().toLocaleString('vi-VN')]])+
  sheet('Thiet_ke',['Tủ','Mạch','Loại','P (W)','Ptt (W)','Itt (A)','Aptomat','Dây / cáp','ΔU (%)'],des)+

  sheet('So_do',['Tủ','Nội dung'],sldLines().flatMap(s=>s[1].map(l=>[s[0],l])))+'</Workbook>';
 download(xml,fname('xls'),'application/vnd.ms-excel');toast('Đã xuất Excel');
